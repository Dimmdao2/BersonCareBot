name: CI

on:
  push:
    branches: [main, development]
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm lint
      - uses: ./.github/actions/cancel-on-failure

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm typecheck
      - uses: ./.github/actions/cancel-on-failure

  test-integrator:
    name: Test (integrator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm test
      - uses: ./.github/actions/cancel-on-failure

  test-webapp-core:
    name: Test (webapp core ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/cache@v5
        with:
          path: |
            apps/webapp/node_modules/.vite
            apps/webapp/node_modules/.experimental-vitest-cache
          key: vitest-webapp-${{ runner.os }}-s${{ matrix.shard }}-${{ hashFiles('pnpm-lock.yaml', 'apps/webapp/vitest.config.ts', 'apps/webapp/vitest.setup.ts', 'apps/webapp/vitest.globalSetup.ts') }}
          restore-keys: |
            vitest-webapp-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm test:webapp:fast
        env:
          VITEST_SHARD: ${{ matrix.shard }}/3
      - uses: ./.github/actions/cancel-on-failure

  test-webapp-behavior:
    name: Test (webapp unit / route / UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/cache@v5
        with:
          path: |
            apps/webapp/node_modules/.vite
            apps/webapp/node_modules/.experimental-vitest-cache
          key: vitest-webapp-behavior-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/webapp/vitest.config.ts', 'apps/webapp/vitest.setup.ts', 'apps/webapp/vitest.ui.setup.ts', 'apps/webapp/vitest.globalSetup.ts') }}
          restore-keys: |
            vitest-webapp-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm test:webapp:behavior
      - uses: ./.github/actions/cancel-on-failure

  build-integrator:
    name: Build (integrator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm build
      - uses: ./.github/actions/cancel-on-failure

  build-webapp:
    name: Build (webapp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/cache@v5
        with:
          path: apps/webapp/.next/cache
          key: nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/webapp/src/**') }}
          restore-keys: |
            nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-
      - run: pnpm build:webapp
      - uses: ./.github/actions/cancel-on-failure

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm run audit
      - uses: ./.github/actions/cancel-on-failure

  saas-rls-conformance:
    name: SaaS RLS conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm run check:saas-a1-rls-conformance
      - uses: ./.github/actions/cancel-on-failure

  u6b-organization-slug-invariants:
    name: U6B organization slug invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - run: sudo apt-get update && sudo apt-get install --yes postgresql-16
      - run: pnpm run smoke:u6b-organization-slug-invariants
      - uses: ./.github/actions/cancel-on-failure

  d30-scheduler-concurrency:
    name: D30 scheduler/outgoing-delivery concurrency proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - run: sudo apt-get update && sudo apt-get install --yes postgresql-16
      - run: pnpm --dir apps/integrator run check:d30-scheduler-lock-concurrency
      - run: pnpm --dir apps/integrator run check:d30-outgoing-delivery-claim-concurrency
      - run: pnpm --dir apps/integrator run check:d30-idempotency-key-concurrency
      - uses: ./.github/actions/cancel-on-failure
