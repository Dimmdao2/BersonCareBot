name: OWASP ZAP (DAST)

# Active scans against named TEST were retired with persistent TEST fixtures. The only retained
# DAST path is an owner-approved, manual PROD baseline scan; baseline mode sends no attack payloads.

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  ZAP_BASELINE_ACTION_REF: 'v0.12.0'

jobs:
  zap-prod-baseline:
    name: ZAP baseline scan (PROD, owner-approved only)
    runs-on: ubuntu-latest
    if: ${{ vars.ZAP_PROD_BASELINE_APPROVED == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Guard — ZAP_PROD_TARGET must be set
        run: |
          if [ -z "${{ vars.ZAP_PROD_TARGET }}" ]; then
            echo "::error::vars.ZAP_PROD_TARGET is not set — refusing to run a baseline scan against an empty/undefined target."
            exit 1
          fi

      - name: ZAP baseline scan (PROD — passive/spider only, never active)
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ vars.ZAP_PROD_TARGET }}
          fail_action: false
          artifact_name: zap-prod-baseline-report

      - name: Upload ZAP PROD baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-prod-baseline-report
          path: |
            report_html.html
            report_md.md
            report_json.json
          if-no-files-found: warn
