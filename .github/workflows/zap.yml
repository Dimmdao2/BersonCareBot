name: OWASP ZAP (DAST)

# Этап 4, docs/_TODO/SECURITY_CI_STACK_PLAN.md lines 52-76. Two independent, separately-gated
# paths:
#   1. TEST active scan  — against a synthetic/demo-fixture test target, inside a narrow,
#      auto-closing GitHub-Actions-IP-allowlist window.
#   2. PROD baseline scan — workflow_dispatch only, non-active (baseline == no attack payloads),
#      gated behind an explicit owner-approval repo variable.
#
# Findings are triage-to-owner, NOT auto-fix (memory `dont-autofix-acceptance-findings`). Active
# scanning against prod is forbidden, always (memory `prod-is-untouchable-hard-rule`).
#
# ---------------------------------------------------------------------------------------------
# GUARD: neither job runs until the owner explicitly wires it up. `vars.ZAP_ENABLED` /
# `vars.ZAP_PROD_BASELINE_APPROVED` are GitHub repo/environment *variables* that are absent by
# default, so both `if:` conditions below evaluate to false and the jobs are skipped (green,
# no-op) on every scheduled/dispatched run until the owner sets them to the literal string
# "true". This is intentional: it prevents weekly "red noise" (or a real prod/test DAST run)
# before targets, firewall wiring, and owner-approved rules review are actually in place.
# ---------------------------------------------------------------------------------------------

on:
  schedule:
    # Weekly, Monday 03:00 UTC. Matches the plan's "еженедельно" cadence for ZAP.
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  ZAP_BASELINE_ACTION_REF: "v0.12.0"
  ZAP_FULL_SCAN_ACTION_REF: "v0.12.0"

jobs:
  # === TEST target — active scan, synthetic data only ========================================
  zap-test-active-scan:
    name: ZAP active scan (TEST target, synthetic fixtures)
    runs-on: ubuntu-latest
    # Owner guard — see header comment. Also requires ZAP_TEST_TARGET to be configured (checked
    # inside the job so a missing target fails loudly instead of scanning an empty string).
    if: ${{ vars.ZAP_ENABLED == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Guard — ZAP_TEST_TARGET must be set
        run: |
          if [ -z "${{ vars.ZAP_TEST_TARGET }}" ]; then
            echo "::error::vars.ZAP_TEST_TARGET is not set — refusing to run an active scan against an empty/undefined target."
            exit 1
          fi

      - name: Fetch current GitHub Actions runner IP ranges (api.github.com/meta)
        id: gh-ranges
        # test.bersoncare.ru is IP-locked to VPN (memory `bcb-test-env-and-redirect-passthrough`).
        # Hosted GitHub runners come from a shared, published range — we pull it live (not a
        # stale pin) right before opening the window, so it reflects GitHub's current CIDR set.
        run: |
          set -euo pipefail
          curl -sSf https://api.github.com/meta -o "${RUNNER_TEMP}/gh-meta.json"
          python3 - "${RUNNER_TEMP}/gh-meta.json" <<'PY' > "${RUNNER_TEMP}/actions-ip-ranges.txt"
          import json, sys
          with open(sys.argv[1]) as f:
              data = json.load(f)
          for cidr in data.get("actions", []):
              print(cidr)
          PY
          echo "Fetched $(wc -l < "${RUNNER_TEMP}/actions-ip-ranges.txt") Actions IP ranges."
          echo "ranges_file=${RUNNER_TEMP}/actions-ip-ranges.txt" >> "$GITHUB_OUTPUT"

      # TODO(owner): OPEN step. Replace this placeholder with the real firewall API call that
      # allowlists the CIDR ranges in `${{ steps.gh-ranges.outputs.ranges_file }}` against the
      # TEST firewall in front of the active-scan target (e.g. test.bersoncare.ru). Wire up
      # whatever `ZAP_FW_*` repo secrets the firewall API needs (endpoint/token/rule id), e.g.
      # `secrets.ZAP_FW_API_ENDPOINT`, `secrets.ZAP_FW_API_TOKEN`. Keep the window as narrow as
      # possible — open here, close in the always()-guarded step below, nothing else in between.
      - name: "TODO(owner): OPEN test firewall allowlist for GitHub Actions IP ranges"
        run: |
          echo "TODO(owner): call the real firewall API here to OPEN the allowlist window."
          echo "TODO(owner): read CIDR ranges from ${{ steps.gh-ranges.outputs.ranges_file }}."
          echo "TODO(owner): plug in secrets.ZAP_FW_API_ENDPOINT / secrets.ZAP_FW_API_TOKEN (or equivalent)."

      - name: ZAP active scan (TEST target — synthetic/demo fixtures only, never a prod dump)
        # Active scan (injection payloads, form submissions) is only ever allowed against the
        # test target seeded with demo fixtures (memory `demo-test-fixtures-on-test-db`), never
        # against a prod dump or prod itself — see header + SECURITY_CI_STACK_PLAN.md §Этап 4.
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: ${{ vars.ZAP_TEST_TARGET }}
          cmd_options: "-a"
          fail_action: false
          artifact_name: zap-test-active-scan-report

      - name: Upload ZAP TEST active-scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-test-active-scan-report
          path: |
            report_html.html
            report_md.md
            report_json.json
          if-no-files-found: warn

      # TODO(owner): CLOSE step. Must mirror the OPEN step above (same firewall API / rule id)
      # and undo exactly what was opened. `if: always()` guarantees this runs even if the scan
      # step above fails or times out, so the allowlist window never stays open unattended.
      - name: "TODO(owner): CLOSE test firewall allowlist (auto-closes even on scan failure)"
        if: always()
        run: |
          echo "TODO(owner): call the real firewall API here to CLOSE/revoke the allowlist window opened above."
          echo "TODO(owner): this step MUST run on failure too — if: always() is already set, keep it."

  # === PROD target — baseline scan ONLY, owner-approved, manual only =========================
  zap-prod-baseline:
    name: ZAP baseline scan (PROD, owner-approved only)
    runs-on: ubuntu-latest
    # Double gate: (a) must be a manual dispatch (never the weekly schedule — prod DAST is not
    # yet in scope until after the first prod deploy + an owner-approved target/rules review,
    # per the plan), and (b) the owner-approval repo variable must be explicitly "true".
    # Baseline mode ONLY — no active-scan payloads are ever sent at prod, no exceptions.
    if: ${{ github.event_name == 'workflow_dispatch' && vars.ZAP_PROD_BASELINE_APPROVED == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Guard — ZAP_PROD_TARGET must be set
        run: |
          if [ -z "${{ vars.ZAP_PROD_TARGET }}" ]; then
            echo "::error::vars.ZAP_PROD_TARGET is not set — refusing to run a baseline scan against an empty/undefined target."
            exit 1
          fi

      - name: ZAP baseline scan (PROD — passive/spider only, never active)
        # action-baseline never sends attack payloads by design (no -a flag) — this is the only
        # ZAP mode ever permitted against prod. Requires the owner-approved target/rules review
        # referenced in SECURITY_CI_STACK_PLAN.md line 73-74 before ZAP_PROD_BASELINE_APPROVED
        # is ever flipped to "true".
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ vars.ZAP_PROD_TARGET }}
          fail_action: false
          artifact_name: zap-prod-baseline-report

      - name: Upload ZAP PROD baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-prod-baseline-report
          path: |
            report_html.html
            report_md.md
            report_json.json
          if-no-files-found: warn
