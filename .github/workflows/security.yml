name: Security

# Dedicated security-scanning stack (SEC-01 / task #881). Kept separate from ci.yml so the
# core build/test pipeline stays stable. Jobs: Gitleaks (secrets), Semgrep (SAST),
# Trivy (fs vuln/misconfig/secret), and a real pnpm CVE audit.
#
# All action versions are pinned (no floating @main). External tool versions are pinned via the
# *_VERSION env vars below and may need a live-CI bump on first run.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: '8.18.4'
  SEMGREP_IMAGE: 'semgrep/semgrep:1.85.0'
  TRIVY_ACTION_REF: '0.28.0'

jobs:
  # --- Secret scanning ----------------------------------------------------------------------
  gitleaks:
    name: Gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v5
        with:
          # Full history so the scan covers past commits, not just the PR diff — the prior
          # incident was `.env` content committed in history (allowlisted in .gitleaks.toml).
          fetch-depth: 0
      - name: Install gitleaks (pinned)
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan git history for secrets
        # Exit non-zero on any new (non-allowlisted) finding => red build. --redact hides values
        # from logs. Uses ./.gitleaks.toml (default-detected in the working dir).
        run: gitleaks git . --no-banner --redact --config .gitleaks.toml --report-format sarif --report-path gitleaks.sarif
      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore

  # --- Gitleaks negative self-test (proves the guard actually catches a secret) --------------
  gitleaks-selftest:
    name: Gitleaks self-test (must catch a planted fake secret)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # No repo secrets are scanned here; checkout is only so the job runs from a consistent
        # working tree. The planted secret lives entirely under $RUNNER_TEMP (below), never
        # inside this checkout, so it can never land in git history or be picked up by the
        # real `gitleaks` job's full-history scan above.
        uses: actions/checkout@v5
      - name: Install gitleaks (pinned)
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Plant fake secret and assert gitleaks detects it
        # The planted string is a well-known AWS-access-key-*shaped* dummy (never a real key —
        # it's the canonical placeholder used in gitleaks' own test suite / docs) that trips
        # gitleaks' default `aws-access-token` rule. It is written to a throwaway directory
        # under $RUNNER_TEMP (outside the repo checkout, never `git add`-ed, never committed),
        # so it cannot trip the real `gitleaks` job's `gitleaks git .` history scan above — that
        # job only ever sees actual commits in this repo, not this job's ephemeral scratch dir.
        # `gitleaks detect` (not `gitleaks git`) is used since this is a plain directory, not a
        # git repo. `--no-git` scans the filesystem directly. We invert the exit code: gitleaks
        # is expected to FAIL (exit non-zero = secret found) — if it instead exits 0 (no finding),
        # the guard is dead and this step (and the workflow) must fail.
        run: |
          set -euo pipefail
          selftest_dir="${RUNNER_TEMP}/gitleaks-selftest-$$"
          mkdir -p "${selftest_dir}"
          trap 'rm -rf "${selftest_dir}"' EXIT

          cat > "${selftest_dir}/planted-secret.txt" <<'EOF'
          # THIS IS A FAKE, NEVER-VALID CREDENTIAL — used only to prove gitleaks detection works.
          aws_access_key_id = AKIAIOSFODNN7EXAMPLE
          aws_secret_access_key = wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          EOF

          set +e
          gitleaks detect --no-git --no-banner --source "${selftest_dir}" --redact
          gitleaks_exit=$?
          set -e

          if [ "${gitleaks_exit}" -eq 0 ]; then
            echo "::error::Gitleaks self-test FAILED: planted fake secret was NOT detected (exit 0)." \
                 "The gitleaks guard is dead — investigate before trusting the main gitleaks job."
            exit 1
          fi

          echo "OK: gitleaks exited ${gitleaks_exit} (non-zero) on the planted secret — detection works."

  # --- SAST ---------------------------------------------------------------------------------
  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.85.0
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Semgrep scan (fail on ERROR)
        # Committed .semgrep.yml (offline core) + managed registry packs. --error makes any
        # ERROR-severity finding fail the build; WARNING findings are reported, not blocking.
        run: |
          semgrep scan \
            --config .semgrep.yml \
            --config p/default \
            --config p/typescript \
            --config p/react \
            --config p/nodejs \
            --config p/secrets \
            --severity ERROR \
            --error \
            --sarif --output semgrep.sarif \
            --metrics off
      - name: Upload semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif
          if-no-files-found: ignore

  # --- Filesystem vuln / misconfig / secret scan --------------------------------------------
  trivy-fs:
    name: Trivy (fs scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
          format: table

  # --- Real dependency CVE audit ------------------------------------------------------------
  # Closes the gap where ci.yml's `audit` job runs saas-regression checks, NOT a CVE audit.
  dependency-audit:
    name: Dependency CVE audit (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm run audit:cve
