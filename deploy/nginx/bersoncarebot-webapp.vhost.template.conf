# BersonCareBot webapp nginx vhost template.
#
# Render manually or by host automation with these values:
#   __SERVER_NAME__  bersoncare.ru | test.bersoncare.ru | space-separated approved host map
#   __UPSTREAM__     http://127.0.0.1:6200 | http://127.0.0.1:6300
#   __PROJECT_ROOT__ /opt/projects/bersoncarebot | /opt/projects/bersoncarebot-test
#
# For the Therapysto future cutover, render through
# deploy/host/therapysto-domain-cutover.sh rather than hand-editing this single-host template.
# The `X-Forwarded-Host $host` header is part of the SaaS A2 contract. Server Actions and origin-sensitive
# requests must see the public host, not the upstream loopback host.

server {
    listen 80;
    server_name __SERVER_NAME__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name __SERVER_NAME__;

    client_max_body_size 55m;

    # TLS directives are host-managed because certificate paths differ by environment.
    # ssl_certificate ...
    # ssl_certificate_key ...

    error_page 502 503 504 =200 /maintenance.html;

    location = /maintenance.html {
        alias __PROJECT_ROOT__/apps/webapp/public/maintenance.html;
        internal;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass __UPSTREAM__;
    }
}
