# Compose overlay for #1100 stream C, shared by BOTH deployment profiles (test and prod). The file keeps
# its historical `.test.` name because audit records and the systemd units already reference it by that
# path; everything profile-specific in it is interpolated from the env file / process environment
# (JITSI_DEPLOYMENT, TURN_HOST, CONFIG, ports), never hardcoded. Applied together with the *upstream*
# docker-jitsi-meet
# docker-compose.yml (vendored by bin/install.sh into vendor/docker-jitsi-meet-${JITSI_RELEASE_TAG}/,
# git-ignored — see README.md "Design decisions"), with the upstream file listed FIRST so the merge and
# the runtime CONFIG tree it expects resolve against the vendored release, not this directory:
#
#   docker compose \
#     -f vendor/docker-jitsi-meet-${JITSI_RELEASE_TAG}/docker-compose.yml \
#     -f deploy/jitsi/docker-compose.override.test.yml \
#     --env-file <the profile's env file, see bin/lib/profile.sh> \
#     -p <the profile's compose project, see bin/lib/profile.sh> up -d
#
# bin/install.sh, bin/restart.sh and bin/rollback.sh all invoke exactly this two-file, one-env-file
# context; the systemd unit's ExecStop uses bin/stop.sh, which does the same, instead of bare
# `docker compose -p <project> down` (that has no compose file to read and cannot know the project
# definition it should be tearing down — see README.md "Design decisions").
#
# CONFIG (a normal key in the sourced env file, see env/jitsi-{test,prod}.env.example) is a deterministic
# absolute host path, not a relative one — upstream's own docker-compose.yml resolves every
# `${CONFIG}/...` volume source against it, and a relative or unset CONFIG is exactly F1 from
# docs/audit/jitsi-coturn-test-package-2026-09-08.md (upstream fell back to resolving those paths inside
# the *vendored release directory itself*, where the source files this override expects do not exist).
#
# This file only narrows exposure, pins images by digest, and adds coturn; it never redefines an
# upstream service's `command`, so an upstream release bump only requires editing this file if a new
# port/volume/image digest is needed.
services:
  web:
    # Verified against the pinned tag's own nginx template
    # (web/rootfs/defaults/default in jitsi/docker-jitsi-meet@stable-11146-2): with DISABLE_HTTPS=1 the
    # container's nginx only ever opens a plain-HTTP `listen 8000` server block — the `listen 8443 ssl`
    # block is compiled out entirely, not merely left with a self-signed cert. Upstream's own compose maps
    # `${HTTP_PORT}:8000` / `${HTTPS_PORT}:8443`; TEST publishes only the loopback HTTP mapping actually
    # backed by a listener in this mode. Do not map HTTPS_PORT here — nothing binds container port 8443
    # when DISABLE_HTTPS=1, and doing so previously left health-check.sh probing a port nothing answers on.
    image: "ghcr.io/jitsi/web:${JITSI_RELEASE_TAG}@sha256:4231d5ff7318ff71d12ffd41afc36adae3c319b40cf79cde39b009b0c68295dc"
    ports: !override
      - "127.0.0.1:${HTTP_PORT}:8000"
    volumes:
      - ./config/web/custom-config.js:/config/custom-config.js:ro
      - ./config/web/custom-interface_config.js:/config/custom-interface_config.js:ro

  prosody:
    image: "ghcr.io/jitsi/prosody:${JITSI_RELEASE_TAG}@sha256:9e341b10134d947e49ca338b9efe8d70ac9d6e8d89d621da2246dfa79fe50363"
    # Browser clients must keep receiving the public TURN hostname. Only the
    # Prosody container resolves that name to this compose network's explicit
    # host gateway so its connected UDP health probe sees the response from
    # the same address it contacted instead of rejecting a hairpin-NAT
    # source-tuple rewrite. Docker's `host-gateway` token points at docker0
    # (normally 172.17.0.1), not this project's bridge; coturn's reply then
    # comes from the project gateway and Prosody correctly rejects the changed
    # source tuple. The configurable subnet below makes this mapping stable.
    #
    # TURN_HOST (not a literal) so the mapping follows the profile: turn.test.therapysto.ru on TEST,
    # turn.therapysto.ru on PROD. It is deliberately left without a default — an empty TURN_HOST renders
    # an invalid extra_hosts entry and compose refuses, instead of silently mapping the other profile's
    # hostname. bin/install.sh separately asserts TURN_HOST equals the profile's expected value.
    extra_hosts:
      - "${TURN_HOST}:${JITSI_DOCKER_GATEWAY:-172.30.110.1}"
  jicofo:
    image: "ghcr.io/jitsi/jicofo:${JITSI_RELEASE_TAG}@sha256:a8d64e46eaa340751a2b5530a4abd4175adf05bff07e9775fc48daae6364cfe9"
    # No public port — Jicofo only talks to Prosody/JVB over the internal bridge network. `!override`
    # (Compose Specification merge tag), not a plain `[]`: compose merges sequences by *appending* across
    # files by default, so a bare `[]` here would leave any port the base file publishes untouched instead
    # of removing it — confirmed against a synthetic base file with `docker compose config` before landing.
    ports: !override []

  jvb:
    image: "ghcr.io/jitsi/jvb:${JITSI_RELEASE_TAG}@sha256:d7dc646d21af07530ae6acf1ace23ea4782445d0362004621a32a5a632a964e9"
    # UDP media stays public (ICE candidates must be directly reachable). The internal Colibri REST API
    # (COLIBRI_REST_ENABLED=1, see env/jitsi-{test,prod}.env.example) IS turned on here, but upstream's own base
    # compose already binds it to `127.0.0.1:${JVB_COLIBRI_PORT:-8080}:8080` — loopback only, never a new
    # public surface — because bin/health-check.sh needs `GET /about/health` on it to prove JVB health
    # instead of trusting `State.Running` alone (see doc/health-checks.md in jitsi/jitsi-videobridge).
    # `!override` replaces the base file's entire port list instead of appending to it, same reasoning as
    # `web`/`jicofo` above. Therefore the upstream loopback Colibri mapping is repeated explicitly beside
    # the two media mappings; omitting it would make health-check.sh's required JVB probe unreachable.
    ports: !override
      - "${JVB_PORT}:${JVB_PORT}/udp"
      - "${JVB_TCP_PORT}:${JVB_TCP_PORT}/tcp"
      - "127.0.0.1:${JVB_COLIBRI_PORT:-8080}:8080"

  coturn:
    image: "coturn/coturn:${COTURN_IMAGE_TAG}@sha256:aa68aab64a3b929d57fc2924c98ea447bf996cf8dade2508e7b71eaf23f1f14e"
    # Profile-scoped so an operator on either host sees the deployment in the container name. Taken from
    # $JITSI_COTURN_CONTAINER (bin/lib/profile.sh), which is what bin/sync-coturn-tls.sh restarts — not
    # rebuilt from ${JITSI_DEPLOYMENT} here, because the two profiles no longer share a name stem
    # (bcb-jitsi-test on TEST, therapysto-jitsi-prod on the new production host, which carries no
    # `bcb`/`bersoncarebot` names at all). Deliberately without a default, same reasoning as TURN_HOST
    # above: every script in this package sources profile.sh before invoking compose, so an empty value
    # means compose was run outside that path and should refuse rather than invent a container name.
    container_name: "${JITSI_COTURN_CONTAINER}"
    restart: "${RESTART_POLICY:-unless-stopped}"
    # The rendered config and the private TLS copy are both 0600 and owned by the deploy account
    # (UID/GID 1000 on both profiles). Do not replace this with root or relax either file to 0644: the explicit
    # numeric user is the least-privilege boundary that lets coturn read only its own mounted assets.
    user: "${COTURN_CONTAINER_UID:-1000}:${COTURN_CONTAINER_GID:-1000}"
    # coturn needs to see real client source ports for its relay allocations; host networking is the
    # standard, documented coturn deployment mode (bridging coturn behind Docker NAT breaks the
    # candidate/relay address it hands back to clients). This is the one intentional exception to "no host
    # network mode" in this stack, and it is why coturn's port range is deliberately narrow
    # (NETWORK_POLICY.md) rather than left at coturn's ~16k-port default.
    network_mode: host
    volumes:
      - ./coturn/turnserver.rendered.conf:/etc/coturn/turnserver.conf:ro
      # Never mount the root-owned ACME source directory. The operator stages a 0600 UID/GID-1000 copy
      # under CONFIG and install.sh fails closed if that ownership/mode is not present.
      - "${CONFIG}/coturn/tls:/etc/coturn/tls:ro"
      # coturn runs as UID/GID 1000, so its writable log/state directories must be deploy-owned bind mounts
      # rather than root-created named volumes.
      - ./coturn/log:/var/log/coturn
      - ./coturn/state:/var/lib/coturn
    command: ["-c", "/etc/coturn/turnserver.conf"]
    healthcheck:
      test: ["CMD", "turnutils_stunclient", "-p", "${TURN_LISTEN_PORT:-3478}", "127.0.0.1"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  meet.jitsi:
    ipam:
      config:
        - subnet: "${JITSI_DOCKER_SUBNET:-172.30.110.0/24}"
          gateway: "${JITSI_DOCKER_GATEWAY:-172.30.110.1}"
