# TEST-only overlay for #1100 stream C. Applied together with the *upstream* docker-jitsi-meet
# docker-compose.yml (vendored by bin/install.sh into vendor/docker-jitsi-meet-${JITSI_RELEASE_TAG}/,
# git-ignored — see README.md "Design decisions"):
#
#   docker compose \
#     -f vendor/docker-jitsi-meet-${JITSI_RELEASE_TAG}/docker-compose.yml \
#     -f deploy/jitsi/docker-compose.override.test.yml \
#     --env-file /opt/env/bersoncarebot/jitsi.test \
#     -p bcb-jitsi-test up -d
#
# This file only narrows exposure and adds coturn; it never redefines an upstream service's image or
# command, so an upstream release bump does not require editing this file unless a new port/volume is
# needed.
services:
  web:
    # Loopback only — the existing host nginx is the single public listener on 443 (see
    # nginx/meet-test.vhost.template.conf). Upstream's default compose binds ${HTTP_PORT}:80 and
    # ${HTTPS_PORT}:443 on all interfaces (`0.0.0.0`); TEST replaces that with an explicit loopback bind so
    # nothing but the host's own nginx can reach the container port directly.
    ports: !override
      - "127.0.0.1:${HTTP_PORT}:${HTTP_PORT}"
      - "127.0.0.1:${HTTPS_PORT}:${HTTPS_PORT}"
    volumes:
      - ./config/web/custom-config.js:/config/custom-config.js:ro
      - ./config/web/custom-interface_config.js:/config/custom-interface_config.js:ro

  prosody:
    # .rendered.cfg.lua is generated by bin/render-secrets.sh from the .template in this same directory;
    # it is git-ignored and never carries a real secret in the repo, only on the running host.
    volumes:
      - ./config/prosody/conf.d/00-turn-external.rendered.cfg.lua:/config/conf.d/00-turn-external.cfg.lua:ro

  jicofo:
    # No public port — Jicofo only talks to Prosody/JVB over the internal bridge network. `!override`
    # (Compose Specification merge tag), not a plain `[]`: compose merges sequences by *appending* across
    # files by default, so a bare `[]` here would leave any port the base file publishes untouched instead
    # of removing it — confirmed against a synthetic base file with `docker compose config` before landing.
    ports: !override []

  jvb:
    # UDP media stays public (ICE candidates must be directly reachable); the internal REST API
    # (JVB_ENABLE_APIS, default off) is never exposed. `!override` replaces the base file's port list
    # instead of appending to it, same reasoning as `web`/`jicofo` above.
    ports: !override
      - "${JVB_PORT}:${JVB_PORT}/udp"
      - "${JVB_TCP_PORT}:${JVB_TCP_PORT}/tcp"

  coturn:
    image: "coturn/coturn:${COTURN_IMAGE_TAG}"
    container_name: bcb-jitsi-test-coturn
    restart: "${RESTART_POLICY:-unless-stopped}"
    # coturn needs to see real client source ports for its relay allocations; host networking is the
    # standard, documented coturn deployment mode (bridging coturn behind Docker NAT breaks the
    # candidate/relay address it hands back to clients). This is the one intentional exception to "no host
    # network mode" in this stack, and it is why coturn's port range is deliberately narrow
    # (NETWORK_POLICY.md) rather than left at coturn's ~16k-port default.
    network_mode: host
    volumes:
      - ./coturn/turnserver.rendered.conf:/etc/coturn/turnserver.conf:ro
      - jitsi-test-turn-tls:/etc/coturn/tls:ro
      - jitsi-test-turn-logs:/var/log/coturn
    command: ["-c", "/etc/coturn/turnserver.conf"]
    healthcheck:
      test: ["CMD", "turnutils_stunclient", "-p", "${TURN_LISTEN_PORT:-3478}", "127.0.0.1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  jitsi-test-turn-tls:
    name: bcb-jitsi-test-turn-tls
  jitsi-test-turn-logs:
    name: bcb-jitsi-test-turn-logs
