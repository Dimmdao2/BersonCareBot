# PROD Jitsi/coturn network policy for the NEW production host 135.106.187.95.
#
# THIS FILE DOES NOT DECLARE A TABLE OF ITS OWN — AND THAT IS THE WHOLE POINT
# --------------------------------------------------------------------------
# The host's `/etc/nftables.conf` declares `table inet filter` with `chain input { type filter hook input
# priority filter; policy drop; ... }` and a `chain forward` with the same drop policy. An earlier version
# of this file mirrored the TEST shape: a private table with its own base chain at priority `filter - 10`,
# accepting the media ports. That design cannot open a single port here. In nftables an `accept` verdict
# ends evaluation of the chain it was reached in — NOT of the hook: the packet is still handed to every
# other base chain registered on the same hook, including the drop-policy one at priority `filter`. An
# earlier-priority accept-table is therefore invisible to the outcome on a drop-policy host.
#
# So this file re-opens the host's OWN `table inet filter` and adds to it:
#   * two REGULAR (non-base) chains that hold the actual accepts, named after this deployment so they are
#     recognisably ours in `nft list ruleset` and can be removed without touching anything else;
#   * one `jump` into each of them, from the host's existing `input` and `forward` base chains.
# Re-declaring `chain input`/`chain forward` here without a type/hook/policy line is a plain "add chain":
# nftables leaves an existing chain's hook, priority and policy untouched and only appends the rule below.
# Nothing in this file flushes, re-policies or deletes anything, and `/etc/nftables.conf` is never
# rewritten by this package.
#
# Docker's own `table ip filter` (managed through iptables-nft) is a separate table and is NEVER touched
# from here.
#
# TWO COMPONENTS, TWO DIFFERENT CHAINS — the TEST file does not distinguish them because on that host
# everything is accepted by default anyway:
#   * coturn runs with `network_mode: host` (docker-compose.override.test.yml), so its listeners are on the
#     host itself and its traffic is evaluated by INPUT: udp 3478, tcp 3478, tcp 5349, udp 49152-49252.
#   * jvb is bridged with published ports, so its traffic is DNAT'd to the container address and evaluated
#     by FORWARD, never by INPUT: udp 10000 and tcp 4443.
# An input-only policy would leave every JVB media packet dropped by the forward chain while `ss` on the
# host still showed the published port — the exact "looks applied, nothing connects" failure this file
# exists to avoid.
#
# The forward rules match this stack's subnet 172.30.110.0/24 rather than an interface name because compose
# names that bridge `br-<hash>`, which is not knowable before the network is created. (Docker only assigns
# a readable interface name when one is asked for; the jitsi compose file does not, so no interface name
# introduced by this stack can run into the 15-character IFNAMSIZ kernel limit.)
#
# SOURCE SCOPING — MEDIA PORTS ARE OPEN TO ANY SOURCE, DELIBERATELY
# -----------------------------------------------------------------
# The trial allow-list (`151.241.228.122` + loopback) gates the WEB vhost, in nginx — that is what keeps
# the trial private: without loading the app from that vhost and holding a valid short-lived JWT, nobody
# gets a room. It is the wrong tool for the media ports. Real WebRTC clients and TURN peers arrive from
# arbitrary addresses — a mobile network, a hotel wifi, the other participant's ISP — so scoping 3478/5349/
# 10000/4443/relay to the trial list would make a call impossible for anyone but the owner's own browser on
# the dev box, including the owner's own phone. These ports are therefore open to any source, and what
# protects them is not the source address:
#   * coturn requires credentials (`use-auth-secret`, short-lived XEP-0215 REST credentials derived from
#     the HMAC secret) — an open 3478 is not an open relay;
#   * its relay targets deny loopback/link-local/RFC1918 (`TURN_DENY_PEER_RANGES`) so it cannot be used to
#     reach anything else on this host or its neighbours, and `TURN_MAX_ALLOCATIONS` caps concurrency;
#   * the relay range is 101 ports, not coturn's ~16k default (NETWORK_POLICY.md);
#   * jvb accepts media only for conferences Jicofo created for an authenticated (JWT) participant.
# During the trial this means: the meeting PAGE is reachable only from the owner's VPN exit, while the
# media/TURN ports answer the whole internet the way any public TURN/JVB deployment must. Narrowing them
# is a deliberate owner decision (and would break every client that is not the dev box), not a hardening
# step to apply quietly.
#
# ORDER CAVEAT worth knowing before reading a green apply line: the jumps below are APPENDED to the host's
# `input`/`forward` chains. If those chains ever gain a terminal `drop`/`reject` rule ahead of the jump,
# this policy stops being reached even though it is still installed.
# `bin/apply-network-policy.sh` proves the chains and the jumps EXIST after applying; it cannot prove they
# are reached, and does not claim to.
#
# NOTHING HERE HAS BEEN APPLIED TO THE PRODUCTION HOST YET (README.md "Status and what remains").
table inet filter {
    chain therapysto_jitsi_prod_in {
        # coturn, host-networked: STUN/TURN over UDP and TCP, TURN over TLS, and the narrow relay range.
        udp dport { 3478, 49152-49252 } accept
        tcp dport { 3478, 5349 } accept
    }

    chain therapysto_jitsi_prod_fwd {
        # jvb, bridged and DNAT'd into 172.30.110.0/24: the container's own egress, the return path of
        # anything it or a client already established, and new inbound media on the two published ports.
        ip saddr 172.30.110.0/24 accept
        ip daddr 172.30.110.0/24 ct state established,related accept
        ip daddr 172.30.110.0/24 udp dport 10000 ct state new accept
        ip daddr 172.30.110.0/24 tcp dport 4443 ct state new accept
    }

    # The host's own base chains, re-opened to add exactly one rule each. No type/hook/priority/policy
    # line here on purpose: this must not redefine what /etc/nftables.conf already declared.
    chain input {
        jump therapysto_jitsi_prod_in
    }

    chain forward {
        jump therapysto_jitsi_prod_fwd
    }
}
