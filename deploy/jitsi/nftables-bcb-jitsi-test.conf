table inet bcb_jitsi_test {
    chain input {
        type filter hook input priority filter + 10; policy accept;

        ip saddr { 10.9.0.0/24, 172.31.9.0/24, 172.17.0.0/16, 172.30.110.0/24, 151.241.228.122, 127.0.0.1 } udp dport { 3478, 49152-49252, 10000 } accept
        ip saddr { 10.9.0.0/24, 172.31.9.0/24, 172.17.0.0/16, 172.30.110.0/24, 151.241.228.122, 127.0.0.1 } tcp dport { 3478, 5349, 4443 } accept

        udp dport { 3478, 49152-49252, 10000 } reject
        tcp dport { 3478, 5349, 4443 } reject
    }
}
