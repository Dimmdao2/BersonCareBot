# Jitsi Meet web nginx vhost template for the NEW production host 135.106.187.95 (#1100 stream C).
# Mirror of ./meet-test.vhost.template.conf — same structure, same proxy semantics, same placeholders;
# only the server name family, the certificate lineage and the allow-list differ.
#
# Render manually or by bin/apply-nginx.sh (which picks this template when JITSI_DEPLOYMENT=prod):
#   __SERVER_NAMES__  meet.therapysto.ru
#   __UPSTREAM__      http://127.0.0.1:8000   (Jitsi web container, loopback-bound, plain HTTP — see
#                                               docker-compose.override.test.yml. Verified against the
#                                               pinned tag's own nginx template: with DISABLE_HTTPS=1 the
#                                               container never opens a TLS listener on 8443 at all, so
#                                               there is no self-signed certificate to proxy to — TLS for
#                                               the public hostname is terminated here, by this vhost.)
#
# TRIAL ACCESS CONTROL. During the production trial this surface has exactly one intended client: the
# owner, arriving from the dev box 151.241.228.122 (his VPN exit). The allow-list therefore has the same
# shape as the TEST vhost's but only those two entries. Opening this vhost to the public internet is a
# separate, explicit owner decision — a real patient link would not reach it as written here, and that is
# deliberate, not an oversight (see NETWORK_POLICY.md).
#
# NOT APPLIED TO ANY PRODUCTION HOST YET — see README.md "Status and what remains". The certificate
# lineage referenced below must exist (covering meet.therapysto.ru and turn.therapysto.ru) before
# bin/apply-nginx.sh --check can pass; issuing it is not part of this package. The lineage is named
# `therapysto-jitsi-prod`, not `bcb-jitsi-prod`: nothing on the new production host carries the old brand
# (owner ruling 10.09.2026, docs/ARCHITECTURE/SERVER CONVENTIONS.md "Именование на новом проде").

server {
    listen 80;
    server_name __SERVER_NAMES__;

    # Keep webroot renewal reachable. The certificate is shared by nginx and coturn's TLS listener;
    # deploy/jitsi/bin/sync-coturn-tls.sh stages coturn's private copy after renewal.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name __SERVER_NAMES__;

    # Trial allow-list: the dev box (owner's VPN exit) and loopback health checks. Do not widen this by
    # guessing a source from the access log — widening it is an owner decision recorded in
    # NETWORK_POLICY.md, alongside the matching change to the raw-port nftables pairing.
    allow 151.241.228.122;
    allow 127.0.0.1;
    deny all;

    client_max_body_size 1m; # this vhost only ever serves the Jitsi web app + XMPP-over-BOSH/WebSocket

    # Линия подставляется из профиля, а не зашита: она на этом хосте общая с остальными именами
    # прода, и зашитый литерал уже один раз разошёлся с реальностью.
    ssl_certificate     /etc/letsencrypt/live/__TLS_LINEAGE__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__TLS_LINEAGE__/privkey.pem;
    # Здесь нет include options-ssl-nginx.conf и ssl_dhparam: этот хост настраивался без плагина
    # certbot для nginx, и обоих файлов у него нет — vhost с ними просто не проходит nginx -t.
    # Параметры заданы явно и совпадают с остальными vhost прода.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s; # BOSH long-poll / WebSocket signalling holds this connection open
        proxy_send_timeout 3600s;
        proxy_pass __UPSTREAM__;
    }
}
