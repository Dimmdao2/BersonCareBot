# Jitsi Meet web nginx vhost template for TEST (#1100 stream C).
# Same template style as ../../nginx/bersoncarebot-webapp.vhost.template.conf.
#
# Render manually or by host automation with these values:
#   __SERVER_NAME__   meet.test.bersoncare.ru
#   __UPSTREAM__      https://127.0.0.1:8443   (Jitsi web container, loopback-bound — see
#                                                docker-compose.override.test.yml)
#
# Access control mirrors the existing test.bersoncare.ru vhost's allow/deny model (network policy lives in
# nginx here, not in a host firewall — see NETWORK_POLICY.md "Current firewall state"): TEST has no real
# external users, only the owner from VPN-trusted subnets.

server {
    listen 80;
    server_name __SERVER_NAME__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name __SERVER_NAME__;

    # Same VPN-trusted subnets as test.bersoncare.ru (SERVER CONVENTIONS.md §"Доступы / VPN"): awg0 PROD
    # relay, awg1 owner VPN, wg-easy laptop NAT, loopback health checks. Update alongside that vhost if the
    # access log ever shows a legitimate source outside these ranges — do not guess a new one here.
    allow 10.9.0.0/24;
    allow 10.9.1.0/24;
    allow 172.17.0.0/16;
    allow 127.0.0.1;
    deny all;

    client_max_body_size 1m; # this vhost only ever serves the Jitsi web app + XMPP-over-BOSH/WebSocket

    # TLS directives are host-managed, same convention as the webapp vhost.
    # ssl_certificate ...
    # ssl_certificate_key ...

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s; # BOSH long-poll / WebSocket signalling holds this connection open
        proxy_send_timeout 3600s;
        proxy_ssl_verify off; # upstream cert is the container's own self-signed cert (DISABLE_HTTPS=1
                               # means Jitsi's web container still speaks TLS internally by default unless
                               # the pinned tag's entrypoint honors this flag as plain HTTP — install.sh
                               # verifies which at apply time and this directive is a no-op if it's HTTP)
        proxy_pass __UPSTREAM__;
    }
}
