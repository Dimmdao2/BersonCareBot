# Jitsi Meet web nginx vhost template for TEST (#1100 stream C).
# Same template style as ../../nginx/bersoncarebot-webapp.vhost.template.conf.
#
# Render manually or by host automation with these values:
#   __SERVER_NAMES__  meet.test.therapysto.ru meet.test.therapygo.ru
#   __UPSTREAM__      http://127.0.0.1:8000   (Jitsi web container, loopback-bound, plain HTTP — see
#                                               docker-compose.override.test.yml. Verified against the
#                                               pinned tag's own nginx template: with DISABLE_HTTPS=1 the
#                                               container never opens a TLS listener on 8443 at all, so
#                                               there is no self-signed certificate to proxy to — TLS for
#                                               the public hostname is terminated here, by this vhost, same
#                                               as every other TEST vhost.)
#
# Access control mirrors the existing test.bersoncare.ru vhost's allow/deny model (network policy lives in
# nginx here, not in a host firewall — see NETWORK_POLICY.md "Current firewall state"): TEST has no real
# external users, only the owner from VPN-trusted subnets.

server {
    listen 80;
    server_name __SERVER_NAMES__;

    # Keep webroot renewal reachable. The certificate is shared by nginx and coturn's TLS listener;
    # deploy/jitsi/bin/sync-coturn-tls.sh stages coturn's private copy after renewal.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name __SERVER_NAMES__;

    # Same VPN-trusted subnets as test.bersoncare.ru (SERVER CONVENTIONS.md §"Доступы / VPN"): awg0 PROD
    # relay, awg1 owner VPN, wg-easy laptop NAT, loopback health checks. Update alongside that vhost if the
    # access log ever shows a legitimate source outside these ranges — do not guess a new one here.
    allow 10.9.0.0/24;
    allow 172.31.9.0/24;
    allow 172.17.0.0/16;
    allow 151.241.228.122;
    allow 127.0.0.1;
    deny all;

    client_max_body_size 1m; # this vhost only ever serves the Jitsi web app + XMPP-over-BOSH/WebSocket

    ssl_certificate     /etc/letsencrypt/live/bcb-jitsi-test/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bcb-jitsi-test/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s; # BOSH long-poll / WebSocket signalling holds this connection open
        proxy_send_timeout 3600s;
        proxy_pass __UPSTREAM__;
    }
}
