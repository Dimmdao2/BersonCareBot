# Монтируется в /config/nginx-custom/ контейнера Jitsi web. Его собственный nginx подключает этот
# каталог сам: `include /run/web/config/nginx-custom/*.conf` в web/rootfs/defaults/meet.conf
# апстрима (проверено против pinned stable-11146-2). Это ЕДИНСТВЕННАЯ причина, по которой стиль
# подаётся здесь, а не на краю: край у TEST и у нового прода разный (nginx против Caddy), а
# контейнер один и тот же.
#
# Две вещи: отдать файл стиля и дописать ссылку на него в HTML комнаты.

location = /therapysto-call.css {
    alias /run/web/config/therapysto-call.css;
    default_type text/css;
    add_header Cache-Control "public, max-age=300";
}

# sub_filter работает и на статике: HTML комнаты отдаёт сам контейнер с диска.
sub_filter '</head>' '<link rel="stylesheet" href="/therapysto-call.css"></head>';
sub_filter_once on;
sub_filter_types text/html;
