# One stack definition, instantiated twice — once as project `therapysto-blue`, once as `therapysto-green`.
# The colour is not written anywhere in this file: it arrives as the compose project name, and the
# published ports arrive as variables. That is what makes the two colours provably identical.
#
# Only `webapp` and `api` answer requests and therefore exist in both colours at once. The two
# background processes sit behind the `singletons` profile and are started only for the colour that
# is live, because two schedulers means every patient gets every reminder twice.

# One network per colour, with a bridge interface whose name we choose rather than the random
# `br-<hash>` docker would pick. The host firewall drops forwarded traffic by default, so container
# networking only works because a rule names these interfaces — and a rule can only name them if the
# name is stable across restarts.
#
# Имя СЕТИ и имя ИНТЕРФЕЙСА здесь намеренно разные. Интерфейс ядра ограничен 15 символами (IFNAMSIZ),
# а `therapysto-green` — шестнадцать: docker принял бы такую сеть и упал бы на создании моста. Поэтому
# интерфейс носит сокращённое имя, и ровно оно стоит в правилах firewall.
networks:
  default:
    name: therapysto-${THERAPYSTO_COLOUR:?THERAPYSTO_COLOUR is required}
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: ${THERAPYSTO_BRIDGE_IFACE:?THERAPYSTO_BRIDGE_IFACE is required}
    ipam:
      config:
        # Подсеть закреплена за цветом (см. therapysto-bluegreen-lib.sh): PostgreSQL слушает адрес шлюза
        # этого моста, и правило firewall пускает 5432 только с него. Плавающая подсеть развалила бы
        # обе привязки разом.
        - subnet: ${THERAPYSTO_NETWORK_SUBNET:?THERAPYSTO_NETWORK_SUBNET is required}
          gateway: ${THERAPYSTO_NETWORK_GATEWAY:?THERAPYSTO_NETWORK_GATEWAY is required}

x-app: &app
  image: ${THERAPYSTO_IMAGE:?THERAPYSTO_IMAGE is required}
  restart: unless-stopped
  # The database is on the host, inside the encrypted volume, and does not listen on TCP. Reaching it
  # through the mounted unix socket keeps it that way: no port opens for the sake of the containers.
  volumes:
    - /var/run/postgresql:/var/run/postgresql
    # Клиентские сертификаты порт-контекста. Приложение открывает пул на каждую роль по TCP с mTLS,
    # значит файлы обязаны быть видны ВНУТРИ контейнера; смонтированы только на чтение.
    # Монтируется ИМЕННО подкаталог клиентского материала, а не весь postgres-mtls: выше по дереву
    # лежат приватный ключ удостоверяющего центра и ключ сервера, которым в приложении делать нечего.
    - /etc/therapysto/postgres-mtls/prod:/etc/therapysto/postgres-mtls/prod:ro
  # Nothing here writes to its own filesystem; uploads go to S3 and logs go to stdout.
  read_only: true
  tmpfs:
    - /tmp
  # Хост под именем `db.host`: PostgreSQL живёт на хосте, а адрес шлюза у синего и зелёного разный.
  # Одно имя на оба цвета — единственный способ держать ОДИН env-файл и при этом honest-TLS: имя
  # входит в SAN серверного сертификата, поэтому проверка идёт по verify-full, а не в обход.
  # Имя указывает на шлюз СВОЕГО моста, а не на docker-псевдоним `host-gateway`: тот отдаёт шлюз
  # дефолтного моста (172.17.0.1), где PostgreSQL не слушает и куда firewall не пускает, — соединение
  # умирает, не дойдя до сервера, и в логе видно только «query error» без единой строки со стороны БД.
  extra_hosts:
    - "db.host:${THERAPYSTO_NETWORK_GATEWAY}"
  # Ключи ролей лежат на хосте как root:therapysto-app-prod 0640 — тот же канон, что на dev/test, где группа
  # ключа равна учётке сервиса. Процесс в контейнере ходит под своим uid, поэтому читать их он может
  # только получив эту группу дополнительной; иначе пришлось бы открывать ключи всем подряд.
  group_add:
    - "${THERAPYSTO_APP_KEY_GID:?THERAPYSTO_APP_KEY_GID is required}"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: journald
    options:
      tag: "therapysto-{{.Name}}"

services:
  webapp:
    <<: *app
    networks:
      default:
        # Свои же фоновые процессы обращаются к вебаппу по ЕГО публичному имени, а не по имени
        # docker-сервиса: маршрутизация поверхностей отвечает 404 на незнакомый `Host`, и `webapp`
        # для неё — незнакомый хост.
        aliases:
          - ${THERAPYSTO_SURFACE_HOST:?THERAPYSTO_SURFACE_HOST is required}
    working_dir: /app/apps/webapp/.next/standalone/apps/webapp
    command: ["node", "server.js"]
    env_file:
      - ${THERAPYSTO_ENV_DIR:?THERAPYSTO_ENV_DIR is required}/webapp.prod
    environment:
      # Порт по умолчанию, а не 6200, ровно по одной причине: свои же фоновые процессы зовут вебапп
      # по его публичному имени, и `Host` тогда несёт `:порт`. Резолвер поверхностей сверяет Host
      # точно и на `therapysto.ru:6200` отвечает 404 — media-worker падал на первом же обращении.
      # Порт 80 даёт тот же Host, что видит пользователь, без исключения в самом резолвере.
      PORT: "80"
      # Inside a container the server must accept on every interface; the host-side publish below is
      # what keeps it off the public network. The systemd unit's 127.0.0.1 would bind the container's
      # own loopback and the published port would answer nothing.
      HOSTNAME: "0.0.0.0"
    # `USER node` не может занять привилегированный порт; граница снимается только внутри этого
    # сетевого namespace и наружу ничего не открывает.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    ports:
      - "127.0.0.1:${THERAPYSTO_WEBAPP_PORT:?THERAPYSTO_WEBAPP_PORT is required}:80"
    healthcheck:
      # The surface resolver rejects a bare loopback Host. Derive the header only from a validated
      # exact origin so malformed env cannot inject another curl header.
      test: ["CMD-SHELL", "health_host=$$(node /app/deploy/host/webapp-health-host.mjs) && curl -fsS -H \"Host: $$health_host\" -o /dev/null http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    <<: *app
    working_dir: /app/apps/integrator
    command: ["node", "dist/main.js"]
    env_file:
      - ${THERAPYSTO_ENV_DIR}/api.prod
    environment:
      PORT: "3200"
    ports:
      - "127.0.0.1:${THERAPYSTO_API_PORT:?THERAPYSTO_API_PORT is required}:3200"
    healthcheck:
      # /health reports the database too, so a container that starts but cannot reach postgres is
      # unhealthy rather than green — the deploy gate reads this.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3200/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # D30 Ш9: worker and scheduler are one resident process — one systemd-equivalent service, one
  # leader lock, one top-level cycle. There is no separate `worker` service anymore.
  scheduler:
    <<: *app
    profiles: ["singletons"]
    working_dir: /app/apps/integrator
    command: ["node", "dist/infra/runtime/scheduler/main.js"]
    env_file:
      - ${THERAPYSTO_ENV_DIR}/api.prod

  media-worker:
    <<: *app
    profiles: ["singletons"]
    working_dir: /app/apps/media-worker
    command: ["node", "dist/main.js"]
    # ⛔ ЭТОТ КОНТЕЙНЕР РАЗБИРАЕТ ЧУЖИЕ БАЙТЫ — и поэтому получает МЕНЬШЕ, чем остальные, а не столько же.
    #
    # Замер 10.09.2026 (план `docs/_TODO/STORAGE_PACKAGES_2026-09-10.md`, М7): у воркера нет ни строки
    # работы с базой — `apps/media-worker/src/env.ts` даже падает, если ему подсунуть учётные данные БД,
    # а всё нужное он берёт через контрольный шов вебаппа. При этом из общего якоря `*app` ему
    # доставались сокет PostgreSQL, каталог с четырьмя клиентскими ключами mTLS и группа, дающая право
    # их читать. Ни для чего из этого у него нет применения — а держит он их в процессе, который парсит
    # враждебное видео. Пустые списки ниже перекрывают якорь: ключи и сокет в контейнер не попадают.
    #
    # `pids_limit` — единственный предел, который здесь можно поставить, не измерив прод: ffmpeg
    # порождает конечное число процессов, и потолок в тысячу останавливает форк-бомбу, не мешая работе.
    # Пределы памяти и CPU НЕ ставятся вслепую: HLS-нарезка пишет во временный каталог, а он у нас
    # tmpfs, то есть занимает ту же память, — неверно выбранный `mem_limit` убивал бы законную
    # перекодировку большого файла. Это отдельный шаг, ему нужен замер живого хоста.
    volumes: []
    group_add: []
    pids_limit: 1024
    env_file:
      - ${THERAPYSTO_ENV_DIR}/media-worker.prod
    environment:
      # Pinned to this project's own webapp, overriding whatever the env file says. The control route
      # is how the media worker reaches the database at all, and a worker talking to the other colour's
      # webapp would be running new code against the old release's control seam.
      MEDIA_WORKER_CONTROL_URL: "http://${THERAPYSTO_SURFACE_HOST}"
    depends_on:
      webapp:
        condition: service_healthy
