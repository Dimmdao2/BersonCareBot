# Gitleaks configuration for BersonCareBot (SEC-01 / task #881).
#
# Purpose: secret scanning in CI. Full-history scan on push to `main` and on every PR.
# This config extends the bundled gitleaks default ruleset and adds a NARROW, documented
# baseline/allowlist so the job is GREEN on the existing history (which contains one known
# historical incident) while any NEW secret still turns the build RED.

title = "BersonCareBot gitleaks config"

[extend]
# Keep the full upstream default ruleset; the allowlist below only carves out documented,
# accepted exceptions. Do NOT disable default rules wholesale.
useDefault = true

[allowlist]
description = "BersonCareBot baseline allowlist — narrowly scoped and documented per SEC-01."

# --- Value allowlist ------------------------------------------------------------------------
# Regexes matched against the candidate secret value. Only obvious non-secret placeholders used
# in committed example/fixture files (memory: demo-test-fixtures-on-test-db).
regexes = [
    '''(?i)(changeme|change-me|example|placeholder|dummy|your[-_]?(?:token|key|secret|password)|<[^>]+>|x{6,})''',
]

# --- Stopwords ------------------------------------------------------------------------------
# Extra low-signal tokens that mark a match as a non-secret.
stopwords = [
    "example",
    "placeholder",
    "changeme",
]
