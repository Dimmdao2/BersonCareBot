# Gitleaks configuration for BersonCareBot (SEC-01 / task #881).
#
# Purpose: secret scanning in CI. Full-history scan on push to `main` and on every PR.
# This config extends the bundled gitleaks default ruleset and adds a NARROW, documented
# baseline/allowlist for exact reviewed findings while any non-ignored secret turns the build
# RED. One historical Telegram bot token deliberately remains non-ignored pending rotation proof.

title = "BersonCareBot gitleaks config"

[extend]
# Keep the full upstream default ruleset; the allowlist below only carves out documented,
# accepted exceptions. Do NOT disable default rules wholesale.
useDefault = true

[[rules]]
id = "telegram-bot-token-assignment"
description = "Telegram Bot API token assigned to a proven repository setting name"
# The bundled v8.30.1 rule requires a nearby `telegr` keyword, so it misses the historical
# `botToken: "<canonical token>"` spelling. Keep this rule deliberately structural: only the
# three setting names present in this repository and Telegram's exact Bot API token shape.
regex = '''\b(?:botToken|telegram_bot_token|TELEGRAM_BOT_TOKEN)\b["'`]?[ \t]*[:=][ \t]*["'`]([0-9]{8,10}:[A-Za-z0-9_-]{35})["'`]'''
secretGroup = 1

[allowlist]
description = "BersonCareBot baseline allowlist — narrowly scoped and documented per SEC-01."

# --- Value allowlist ------------------------------------------------------------------------
# Regexes matched against the candidate secret value. Only obvious non-secret placeholders used
# in committed example/fixture files (memory: demo-test-fixtures-on-test-db).
regexes = [
    '''(?i)(changeme|change-me|example|placeholder|dummy|your[-_]?(?:token|key|secret|password)|<[^>]+>|x{6,})''',
    # Ссылка на переменную окружения — это КОД, а не значение. `secretKey: env.PATIENT_S3_SECRET_KEY`
    # ловится общим правилом `generic-api-key` как «ключ рядом с присваиванием», и каждая такая
    # строка при переезде между файлами давала новый отпечаток в `.gitleaksignore`. Решение
    # владельца 12.09, дословно: «надо сделать, чтобы он их так не познавал… нас там этих исключений
    # накопится, я чувствую, миллион». Правило структурное и узкое: имя обязано быть ВЕРХНИМ
    # регистром с подчёркиваниями после `env.`/`process.env.` и ничем больше — настоящий ключ
    # такой формы не имеет, а значит эта строчка не может спрятать литерал.
    '''^(?:process\.)?env\.[A-Z][A-Z0-9_]{2,}$''',
]

# --- Stopwords ------------------------------------------------------------------------------
# Extra low-signal tokens that mark a match as a non-secret.
stopwords = [
    "example",
    "placeholder",
    "changeme",
]
