  <style>
    :root {
      --ink:#17202c;--muted:#66748a;--line:#dce3ec;--soft:#f4f6f9;--blue:#365f9d;

    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:#eef1f5;font:14px/1.48 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    button,input,select{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}
    :focus-visible{outline:3px solid var(--focus);outline-offset:2px}.prototype-bar{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:minmax(220px,1fr) minmax(280px,2fr) auto auto auto;gap:10px;align-items:center;padding:11px 18px;color:#fff;background:#182231;box-shadow:0 4px 16px rgba(0,0,0,.18)}
    .prototype-title strong{display:block;font-size:15px}.prototype-title small{color:#bcc7d5}.prototype-bar select{width:100%;padding:9px 34px 9px 11px;color:#fff;border:1px solid #526073;border-radius:8px;background:#263347}.viewport-toggle{display:flex;gap:4px;padding:3px;border-radius:9px;background:#263347}.prototype-bar button{min-height:34px;padding:7px 11px;color:#c7d0dc;border:0;border-radius:7px;background:transparent}.prototype-bar button.active{color:#182231;background:#fff}
    .workspace{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 64px)}.flow-map{padding:18px 12px;overflow:auto;border-right:1px solid #d3dae4;background:#f8fafc}.flow-map h2{margin:0 8px 12px;font-size:12px;color:#667289;text-transform:uppercase;letter-spacing:.08em}.flow-map button{display:grid;grid-template-columns:28px 1fr;gap:8px;width:100%;padding:9px 8px;text-align:left;color:#3d4858;border:0;border-radius:9px;background:transparent}.flow-map button:hover{background:#edf1f6}.flow-map button.active{color:#244f8e;background:#e5edf8}.step-no{display:grid;place-items:center;width:24px;height:24px;font-size:11px;font-weight:700;border:1px solid #cbd3df;border-radius:50%;background:#fff}.flow-map button.active .step-no{color:#fff;border-color:var(--blue);background:var(--blue)}.step-copy strong{display:block;font-size:12px}.step-copy small{color:#7b8798;font-size:10px}
    .canvas{min-width:0;padding:28px;overflow:auto}.device{width:min(1280px,100%);min-height:720px;margin:0 auto;overflow:hidden;border:1px solid #cdd5df;border-radius:15px;background:#fff;box-shadow:var(--shadow)}.canvas.mobile .device{position:relative;width:390px;min-height:760px;border-radius:28px}.prototype-note{max-width:1280px;margin:12px auto 0;color:#69778a;font-size:11px}
    .public-header{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:15px 28px;border-bottom:1px solid var(--line)}.brand{display:flex;gap:10px;align-items:center}.brand-mark{display:grid;place-items:center;width:34px;height:34px;color:#fff;font-weight:800;border-radius:9px;background:var(--blue)}.brand small{display:block;color:var(--muted)}.public-nav,.actions{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.public-nav a,.public-nav button{padding:0;color:#48576b;border:0;background:transparent;text-decoration:none}.public-nav a:hover,.public-nav button:hover{text-decoration:underline}.hero{padding:68px 58px;background:linear-gradient(135deg,#f8fafc,#edf2f8)}.hero-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:26px;align-items:center}.hero h1{max-width:700px;margin:0;font-size:50px;line-height:1.06;letter-spacing:-.04em}.hero p{max-width:620px;margin:20px 0;color:#596679;font-size:18px}.hero-card{padding:24px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.92);box-shadow:0 14px 35px rgba(39,55,78,.08)}
    .app-shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:720px}.app-sidebar{display:flex;flex-direction:column;padding:18px 12px;border-right:1px solid var(--line);background:#fbfcfd}.app-sidebar .brand{padding:0 7px 18px}.surface-switch{margin:0 4px 15px;padding:9px;border:1px solid #d7dee8;border-radius:9px;background:#fff}.surface-switch span{display:block;color:var(--muted);font-size:10px}.surface-switch a{display:inline-block;margin-top:2px;color:#263d60;font-weight:750;text-decoration:none}.nav-label{margin:12px 9px 6px;color:#8590a1;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.shell-nav{display:grid;gap:2px}.shell-nav a{padding:9px 10px;color:#424d5c;border-radius:8px;text-decoration:none}.shell-nav a[aria-current="page"]{color:#244f8e;background:#e4eaf3;font-weight:750}.sidebar-foot{margin-top:auto;padding:12px 8px 0;color:var(--muted);font-size:11px;border-top:1px solid var(--line)}.app-main{min-width:0;background:#fff}.app-top{display:flex;justify-content:space-between;align-items:center;min-height:58px;padding:10px 22px;border-bottom:1px solid var(--line)}.context{display:flex;gap:8px;align-items:center;color:var(--muted)}.context-dot{width:8px;height:8px;border-radius:50%;background:var(--green)}.mobile-top,.bottom-nav,.mobile-drawer{display:none}
    .page{padding:24px}.page-header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:20px}.eyebrow{margin-bottom:4px;color:var(--blue);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.page h1{margin:0;font-size:27px;letter-spacing:-.025em}.page-header p{max-width:700px;margin:6px 0 0;color:var(--muted)}.status-pill,.badge{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;border-radius:99px;font-size:11px;font-weight:700}.status-pill{padding:6px 9px;color:#36516f;background:#edf2f7}.badge{padding:5px 8px;color:#445064;background:#edf0f4}.badge.good{color:var(--green);background:var(--green-soft)}.badge.warn{color:var(--amber);background:var(--amber-soft)}.badge.bad{color:var(--red);background:var(--red-soft)}
    .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{grid-column:span 4;min-width:0;padding:17px;border:1px solid var(--line);border-radius:12px;background:#fff}.card.wide{grid-column:span 8}.card.full{grid-column:1/-1}.card.soft{background:var(--soft)}.card h2,.card h3{margin:0 0 8px;font-size:15px}.card p{margin:5px 0;color:var(--muted)}.metric{margin:3px 0 7px;font-size:28px;font-weight:750}.list{display:grid;gap:8px;margin-top:10px}.list-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:#fff}.list-row strong{display:block}.list-row small{display:block;color:var(--muted)}.form{display:grid;gap:13px}.field label{display:block;margin-bottom:5px;color:#526075;font-size:12px;font-weight:700}.field input,.field select{width:100%;min-height:42px;padding:10px 12px;color:#3d4756;border:1px solid #cfd6e0;border-radius:8px;background:#fff}.field input[aria-invalid="true"]{border-color:#c55;background:#fff8f8}.help{margin-top:4px;color:var(--muted);font-size:11px}.help.error{color:var(--red)}.btn{display:inline-flex;justify-content:center;align-items:center;min-height:39px;padding:8px 14px;color:#fff;border:1px solid var(--blue);border-radius:8px;background:var(--blue);font-weight:700;text-decoration:none}.btn.secondary{color:#3e4b5d;border-color:#cfd6df;background:#fff}.btn.danger{color:var(--red);border-color:#e2bcbc;background:#fff6f6}.actions{margin-top:15px}.alert{grid-column:1/-1;display:flex;gap:12px;padding:14px;border:1px solid #ead9a8;border-radius:10px;background:var(--amber-soft)}.alert.bad{border-color:#edc5c5;background:var(--red-soft)}.alert.good{border-color:#b9dfcf;background:var(--green-soft)}.alert strong{display:block}.alert p{margin:2px 0 0;color:#596272}.progress{height:7px;overflow:hidden;border-radius:99px;background:#e7ebf0}.progress span{display:block;height:100%;border-radius:inherit;background:var(--blue)}.timeline{display:grid}.event{position:relative;padding:0 0 18px 24px}.event::before{content:"";position:absolute;left:6px;top:5px;width:9px;height:9px;border:2px solid #fff;border-radius:50%;background:var(--blue);box-shadow:0 0 0 1px var(--blue)}.event::after{content:"";position:absolute;left:10px;top:17px;bottom:0;border-left:1px solid #cbd3df}.event:last-child::after{display:none}.event small{display:block;color:var(--muted)}
    .diagnostics{grid-column:1/-1;margin-top:2px;padding:10px 12px;border:1px dashed #aab5c4;border-radius:10px;background:#fafbfd;color:#475467}.diagnostics summary{cursor:pointer;font-weight:750}.diagnostics dl{display:grid;grid-template-columns:max-content 1fr;gap:5px 12px;margin:10px 0 0;font-size:12px}.diagnostics dt{color:#748093}.diagnostics dd{margin:0}.action-outcome{grid-column:1/-1;display:flex;gap:12px;padding:14px;border:1px solid #b9d1ee;border-radius:10px;background:var(--blue-soft)}.action-outcome strong{display:block}.action-outcome p{margin:2px 0 0;color:#4e6178}.candidate-note{padding:10px 12px;border-left:3px solid #9d7627;background:#fff9e9;color:#66552f}.step-footer{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 18px;border-top:1px solid var(--line);background:#fafbfc}.step-footer small{color:var(--muted)}.step-footer .actions{margin:0}.skip-link{position:fixed;z-index:100;left:8px;top:8px;transform:translateY(-160%);padding:9px;color:#fff;background:#111}.skip-link:focus{transform:none}
    @media(max-width:760px){.prototype-bar{grid-template-columns:1fr auto auto}.prototype-title{display:none}.prototype-bar select{grid-column:1/-1;grid-row:2}.workspace{grid-template-columns:1fr}.flow-map{display:none}.canvas{padding:12px 4px}.device{width:390px;max-width:100%;min-height:720px;border-radius:20px}.prototype-note{padding:0 10px}}
    .canvas.mobile .app-shell{display:block;min-height:760px;padding-bottom:65px}.canvas.mobile .app-sidebar,.canvas.mobile .app-top{display:none}.canvas.mobile .mobile-top{display:flex;justify-content:space-between;align-items:center;min-height:58px;padding:9px 14px;border-bottom:1px solid var(--line)}.mobile-menu-btn{min-width:42px;min-height:42px;border:1px solid var(--line);border-radius:9px;background:#fff}.canvas.mobile .mobile-drawer.open{position:absolute;z-index:12;inset:58px 0 auto;display:block;padding:14px;border-bottom:1px solid var(--line);background:#fff;box-shadow:0 16px 30px rgba(0,0,0,.16)}.canvas.mobile .mobile-drawer .shell-nav{margin-top:10px}.canvas.mobile .bottom-nav{position:absolute;inset:auto 0 0;display:grid;grid-template-columns:repeat(5,1fr);min-height:62px;border-top:1px solid var(--line);background:#fff}.canvas.mobile .bottom-nav a{display:grid;place-items:center;padding:7px 2px;color:#748093;font-size:10px;text-align:center;text-decoration:none}.canvas.mobile .bottom-nav a[aria-current="page"]{color:var(--blue);font-weight:800;background:var(--blue-soft)}.canvas.mobile .page{padding:18px 14px}.canvas.mobile .page-header{display:block}.canvas.mobile .page-header .status-pill{margin-top:10px}.canvas.mobile .page h1{font-size:23px}.canvas.mobile .grid{display:block}.canvas.mobile .card,.canvas.mobile .alert,.canvas.mobile .diagnostics{margin-bottom:11px}.canvas.mobile .hero{padding:38px 20px}.canvas.mobile .hero-grid{display:block}.canvas.mobile .hero h1{font-size:35px}.canvas.mobile .hero p{font-size:16px}.canvas.mobile .hero-card{margin-top:20px}.canvas.mobile .public-header{align-items:flex-start;padding:12px 14px}.canvas.mobile .public-nav{justify-content:flex-end;gap:8px}.canvas.mobile .public-nav .desktop-only{display:none}.canvas.mobile .step-footer{align-items:flex-start;flex-direction:column}.canvas.mobile .step-footer .actions{width:100%}.canvas.mobile .step-footer .btn{flex:1}
  </style>

<body>
  <a class="skip-link" href="#prototype-content">К содержанию прототипа</a>
  <header class="prototype-bar">
    <div class="prototype-title"><strong>UX-07 · scenario prototype</strong><small>Продуктовый слой + отдельная проверочная информация</small></div>
    <select id="flowSelect" aria-label="Выберите сценарий"></select>
    <div class="viewport-toggle" role="group" aria-label="Размер экрана"><button type="button" data-viewport="desktop" class="active">Desktop</button><button type="button" data-viewport="mobile">Mobile</button></div>
    <button type="button" id="mapToggle" class="active" aria-pressed="true">Карта</button>
    <button type="button" id="diagnosticsToggle" aria-pressed="false">Проверка</button>
  </header>
  <main class="workspace" id="prototype-content">
    <nav class="flow-map" id="flowMap" aria-label="Состояния сценария"><h2>Карта сценария</h2><div id="stepList"></div></nav>
    <section class="canvas" id="canvas" aria-live="polite">
      <div class="device" id="device"></div>
      <p class="prototype-note">Статический UX-прототип. Все люди, контакты и организации вымышлены. Нерешённые OM/BD-вопросы показаны только в раскрываемом режиме «Проверка».</p>
    </section>
  </main>
  <script>
    const S=(stateId,screenId,title,kind,status,copy,options={})=>({stateId,screenId,title,kind,status,copy,context:"north",...options});
    const A=(label,target,style="primary")=>({label,target,style});
    const R=(label,result,style="secondary")=>({label,result,style});
    const outcomes={
      "otp-resent":{title:"Новый код отправлен",copy:"Предыдущий код больше не нужен. Повторный запрос защищён от случайных дублей."},
      "workspace-pending":{title:"Подготовка ещё продолжается",copy:"Кабинет создаётся. Повторная проверка ничего не дублирует; можно проверить готовность позже."},
      "account-recovery":{title:"Восстановление доступа",copy:"Используйте сохранённый код восстановления. Если его нет, обратитесь в поддержку BersonCare — организация и медицинские данные не меняются."},
      "invite-resent":{title:"Приглашение отправлено повторно",copy:"Новая ссылка ушла на тот же подтверждённый рабочий email. Получатель и роль не изменились."},
      "public-support":{title:"Поддержка BersonCare",copy:"Поможем со входом, безопасностью и работой платформы. Для вопросов о лечении или расписании свяжитесь с организацией."},
      "security-help":{title:"Помощь с защитой аккаунта",copy:"Можно подключить второй способ подтверждения или использовать сохранённый код восстановления. Доступ организации не меняется."},
      "invite-refresh-requested":{title:"Запрос на новую ссылку принят",copy:"Если повторная отправка доступна, письмо уйдёт на адрес, связанный с приглашением. Кабинет управления не открывается."},
      "owner-notified-public":{title:"Владелец организации уведомлён",copy:"Доступ остаётся закрытым, пока организация не освободит место или не изменит план."},
      "clinic-contact-requested":{title:"Запрос для клиники подготовлен",copy:"Клиника получит просьбу выпустить новое приглашение для правильного адреса. Медицинские данные и чужой кабинет не открываются."},
      "staff-invite-declined":{title:"Приглашение отклонено",copy:"Доступ к организации не создан. Чтобы присоединиться позже, понадобится новое приглашение."},
      "sensitive-action-confirmed":{title:"Действие подтверждено",copy:"Дополнительная проверка пройдена. Изменение применяется только в текущей организации."},
      "browser-continued":{title:"Продолжаем в браузере",copy:"Установка не обязательна. Кабинет и лечение остаются доступны в текущем браузере."},
      "install-guide":{title:"Инструкция по установке",copy:"Откройте меню браузера и выберите «На экран Домой» или «Установить». После установки войдите тем же email."},
      "push-enabled":{title:"Напоминания включены",copy:"Разрешение сохранено для этого устройства. Медицинские подробности на экране блокировки не показываются."},
      "push-later":{title:"Решение отложено",copy:"Email-напоминания и доступ к лечению продолжают работать. Настройку можно открыть позже."},
      "push-system-guide":{title:"Как включить уведомления",copy:"Откройте настройки сайта или приложения на устройстве и разрешите уведомления для BersonCare."},
      "booking-status-pending":{title:"Статус пока не изменился",copy:"Заявка сохранена и всё ещё ожидает подтверждения. Повторная проверка не создаёт новую запись."},
      "calendar-added":{title:"Событие подготовлено для календаря",copy:"В календарь добавляются только дата, время и название организации — без медицинских подробностей."},
      "appointment-preparation":{title:"Подготовка к приёму",copy:"Возьмите документы, которые просила клиника, и приходите за 10 минут. Уточнения доступны у организации."},
      "nearest-visit":{title:"Ближайший визит",copy:"Завтра, 10:00 · Центр движения · консультация. Контекст другой организации не показывается."},
      "sender-settings-checked":{title:"Проверка завершена",copy:"Адрес BersonCare готов. Адрес организации пока не подтверждён и не используется для отправки."},
      "visit-assignment":{title:"Назначение конкретного визита",copy:"18 июля, 10:30 · ответственный Алексей С. Изменение относится только к этому визиту и требует подтверждения."},
      "public-documents":{title:"Документы BersonCare",copy:"Здесь представлены условия использования, политика конфиденциальности и правила обработки данных платформой."}
    };
    const flows={
      acquisition:{label:"1 · Лендинг → регистрация → первый день",steps:[
        S("ACQ-01","PUB-01","Практика, которая работает вместе с вами","landing","default","Расписание, сопровождение пациентов и работа команды — в одном кабинете.",{context:"platform",actions:[A("Создать кабинет",1),A("У меня есть приглашение","staff:3","secondary")]}),
        S("ACQ-02","PUB-03","Создайте рабочее пространство","form","validation","Одна регистрация подходит частной практике и клинике.",{context:"platform",fields:["Рабочий email","Имя и фамилия","Название практики"],actions:[A("Продолжить",2),A("Вернуться на главную",0,"secondary")]}),
        S("ACQ-03","PUB-03","Подтвердите email","otp","cooldown / expired recovery","Код отправлен на a•••@example.test. Если письмо не пришло, можно запросить новое.",{context:"platform",actions:[A("Подтвердить",3),R("Отправить новый код","otp-resent")]}),
        S("ACQ-04","PUB-03","Создаём рабочее пространство","progress","idempotent provision","Это займёт несколько секунд. Повторное открытие страницы не создаст второй кабинет.",{context:"platform",actions:[A("Открыть настройку",4),R("Проверить ещё раз","workspace-pending")]}),
        S("ACQ-05","MGMT-01","Первичная настройка","checklist","setup 3/6","Сначала защитите аккаунт и заполните основные данные. Остальное можно закончить позже.",{modeSwitch:true,actions:[A("Настроить безопасность",5),A("Перейти к профилю специалиста",6,"secondary")]}),
        S("ACQ-05","ACC-02","Защитите аккаунт владельца","security","factor enroll","Подключите второй способ подтверждения и сохраните коды восстановления.",{modeSwitch:true,actions:[A("Подключить защиту",4),R("Как восстановить доступ","account-recovery")]}),
        S("ACQ-05","MGMT-01","Профиль специалиста ещё создаётся","error","binding pending","Управление организацией уже доступно. Клиническая работа откроется после завершения настройки.",{actions:[A("Проверить готовность",7),A("Вернуться к настройке",4,"secondary")]}),
        S("ACQ-05","CLIN-01","Сегодня","dashboard","first clinical value","Ближайшие приёмы и важные задачи вашей практики.",{actions:[A("Открыть пациентов","cliniccard:0"),A("К настройке организации",4,"secondary")]})
      ]},
      staff:{label:"2 · Приглашение сотрудника",steps:[
        S("STF-01","MGMT-02","Команда и приглашения","team","members + pending","Здесь видно, кто уже работает и кто ещё не принял приглашение.",{actions:[A("Пригласить сотрудника",1)]}),

    function diagnostics(step){return `<details class="diagnostics" ${diagnosticsVisible?"open":""}><summary>Проверочная информация для ревьюера</summary><dl><dt>State</dt><dd>${esc(step.stateId)}</dd><dt>Canonical screen</dt><dd>${esc(step.screenId)}</dd><dt>Contract status</dt><dd>${esc(step.status)}</dd><dt>Context</dt><dd>${esc(step.context)}</dd><dt>Security trace</dt><dd>object/relationship → organization → capability → presentation</dd><dt>Pending gates</dt><dd>${/OM-|BD-|candidate/.test(step.status+step.copy)?"OM/BD остаются нерешёнными":"нет новых owner rulings"}</dd></dl></details>`}
    function publicHeader(step){const org=step.context==="north-public";return `<header class="public-header"><div class="brand"><div class="brand-mark">BC</div><div><strong>${org?"Клиника Север":"BersonCare"}</strong><small>${org?"на платформе BersonCare":"Для специалистов и пациентов"}</small></div></div><nav class="public-nav" aria-label="Публичная навигация"><a class="desktop-only" href="${hashFor('acquisition',0)}" data-link-flow="acquisition" data-link-step="0">Возможности</a><button type="button" data-result="public-support" data-actor="anonymous" data-context="${esc(step.context)}" data-capability="public-help" data-outcome="public-support">Поддержка</button><button type="button" data-result="public-documents" data-actor="anonymous" data-context="${esc(step.context)}" data-capability="public-help" data-outcome="public-documents">Документы</button></nav></header>`}
    function shell(step){const publicScreen=publicScreenIds.has(step.screenId);if(step.kind==="landing")return `${publicHeader(step)}<section class="hero"><div class="hero-grid"><div><div class="eyebrow">Для специалистов и клиник</div><h1 id="pageTitle" tabindex="-1">${esc(step.title)}</h1><p>${esc(step.copy)}</p>${actionsHtml(step)}</div><aside class="hero-card"><h2>Один рабочий день</h2><div class="list"><div class="list-row"><span><strong>Расписание</strong><small>Записи и изменения</small></span><span aria-hidden="true">✓</span></div><div class="list-row"><span><strong>Пациенты</strong><small>Программы и динамика</small></span><span aria-hidden="true">✓</span></div><div class="list-row"><span><strong>Команда</strong><small>Для клиники</small></span><span aria-hidden="true">✓</span></div></div></aside></div></section><div class="page"><div class="grid">${outcomeHtml()}${diagnostics(step)}</div></div>`;
      const page=`<div class="page"><header class="page-header"><div><div class="eyebrow">${publicScreen?"Безопасный вход":activeGroup(step.screenId)==="patient"?"Приложение пациента":"Рабочий кабинет"}</div><h1 id="pageTitle" tabindex="-1">${esc(step.title)}</h1><p>${esc(step.copy)}</p></div>${statusHtml(step)}</header><div class="grid">${outcomeHtml()}${cards(step)}${diagnostics(step)}</div></div>`;
      if(publicScreen)return `${publicHeader(step)}${page}`;
      const group=activeGroup(step.screenId);const patient=group==="patient";const neutral=step.context==="neutral";const org=step.context==="movement"?"Центр движения":neutral?"Организация не выбрана":"Клиника Север";const surface=neutral?"Выбор организации":group==="management"?"Управление организацией":group==="clinical"?"Клиническая работа":patient?"Кабинет пациента":"Личный аккаунт";const switcher=step.modeSwitch?`<div class="surface-switch"><span>Текущий режим</span><a href="${group==="clinical"?hashFor('dual',0):hashFor('dual',2)}" data-link-flow="dual" data-link-step="${group==="clinical"?0:2}">${surface} · сменить</a></div>`:"";const nav=neutral?"":navHtml(step);const mobileNav=neutral?`<nav class="shell-nav" aria-label="Восстановление"><a href="${hashFor('multiorg',1)}" aria-current="page">Выбор организации</a><a href="${hashFor(currentFlow,currentStep,viewport,'public-support')}" data-result="public-support">Поддержка</a></nav>`:navHtml(step,true);
      return `<div class="app-shell"><aside class="app-sidebar"><div class="brand"><div class="brand-mark">BC</div><div><strong>BersonCare</strong><small>${patient?"Пациент":"Сотрудник"}</small></div></div>${switcher}<div class="nav-label">Разделы</div>${nav}<div class="sidebar-foot">${org}${patient&&!neutral?" · текущая организация":""}</div></aside><div class="app-main"><header class="mobile-top"><div class="brand"><div class="brand-mark">BC</div><div><strong>${org}</strong><small>${surface}</small></div></div><button type="button" class="mobile-menu-btn" aria-expanded="false" aria-controls="mobileDrawer" aria-label="Открыть навигацию">☰</button></header><div class="mobile-drawer" id="mobileDrawer" aria-hidden="true" tabindex="-1"><strong>${org}</strong>${step.modeSwitch?switcher:""}${mobileNav}</div><header class="app-top"><div class="context"><span class="context-dot"></span><strong>${org}</strong><span>· ${surface}</span></div>${statusHtml(step,"badge")}</header>${page}</div>${patient&&!neutral?`<nav class="bottom-nav" aria-label="Основная навигация пациента">${(navTargets.patient.slice(0,5)).map(([label,target,id])=>{const t=parseTarget(target);const active=step.screenId===id;return `<a href="${hashFor(t.flow,t.step)}" data-link-flow="${t.flow}" data-link-step="${t.step}" ${active?'aria-current="page"':''}><span aria-hidden="true">●</span>${label}</a>`}).join("")}</nav>`:""}</div>`;
    }
    function closeDrawer({restoreFocus=true}={}){const drawer=el("mobileDrawer");if(!drawer||!drawerOpen)return;drawerOpen=false;drawer.classList.remove("open");drawer.setAttribute("aria-hidden","true");if(drawerToggle){drawerToggle.setAttribute("aria-expanded","false");drawerToggle.setAttribute("aria-label","Открыть навигацию");if(restoreFocus)drawerToggle.focus()}}
    function toggleDrawer(button){const drawer=el("mobileDrawer");if(!drawer)return;if(drawerOpen){closeDrawer();return}drawerOpen=true;drawerToggle=button;drawer.classList.add("open");drawer.setAttribute("aria-hidden","false");button.setAttribute("aria-expanded","true");button.setAttribute("aria-label","Закрыть навигацию");requestAnimationFrame(()=>(drawer.querySelector("a,button")||drawer).focus())}
    function render(){drawerOpen=false;drawerToggle=null;const flow=flows[currentFlow],step=flow.steps[currentStep];el("flowSelect").value=currentFlow;el("stepList").innerHTML=flow.steps.map((s,i)=>`<button type="button" data-step="${i}" class="${i===currentStep?"active":""}" ${i===currentStep?'aria-current="step"':''}><span class="step-no">${i+1}</span><span class="step-copy"><strong>${esc(s.title)}</strong><small>${esc(s.stateId)} → ${esc(s.screenId)}</small></span></button>`).join("");el("device").innerHTML=shell(step)+`<footer class="step-footer"><small>Проверочная карта: состояние ${currentStep+1} из ${flow.steps.length}</small><div class="actions"><button type="button" class="btn secondary" data-review-prev ${currentStep===0?"disabled":""}>Предыдущий макет</button><button type="button" class="btn" data-review-next ${currentStep===flow.steps.length-1?"disabled":""}>Следующий макет</button></div></footer>`;el("canvas").classList.toggle("mobile",viewport==="mobile");document.querySelectorAll("[data-viewport]").forEach(b=>b.classList.toggle("active",b.dataset.viewport===viewport));const showMap=mapVisible&&viewport!=="mobile";el("flowMap").style.display=showMap?"block":"none";document.querySelector(".workspace").style.gridTemplateColumns=showMap?"260px minmax(0,1fr)":"1fr";el("mapToggle").classList.toggle("active",mapVisible);el("mapToggle").setAttribute("aria-pressed",String(mapVisible));el("diagnosticsToggle").classList.toggle("active",diagnosticsVisible);el("diagnosticsToggle").setAttribute("aria-pressed",String(diagnosticsVisible));document.title=`${step.title} · UX-07`}
    Object.entries(flows).forEach(([key,flow])=>el("flowSelect").insertAdjacentHTML("beforeend",`<option value="${key}">${esc(flow.label)}</option>`));
    el("flowSelect").addEventListener("change",e=>setState(e.target.value,0));el("stepList").addEventListener("click",e=>{const b=e.target.closest("[data-step]");if(b)setState(currentFlow,Number(b.dataset.step))});
    document.addEventListener("click",e=>{const result=e.target.closest("[data-result]");if(result){e.preventDefault();setOutcome(result.dataset.result);return}const go=e.target.closest("[data-go-flow]");if(go){setState(go.dataset.goFlow,Number(go.dataset.goStep));return}const link=e.target.closest("[data-link-flow]");if(link){e.preventDefault();setState(link.dataset.linkFlow,Number(link.dataset.linkStep));return}if(e.target.closest("[data-review-prev]")&&currentStep>0)setState(currentFlow,currentStep-1);if(e.target.closest("[data-review-next]")&&currentStep<flows[currentFlow].steps.length-1)setState(currentFlow,currentStep+1);const menu=e.target.closest(".mobile-menu-btn");if(menu)toggleDrawer(menu)});
    document.addEventListener("keydown",e=>{if(e.key==="Escape"&&drawerOpen){e.preventDefault();closeDrawer()}});
    document.querySelector(".viewport-toggle").addEventListener("click",e=>{const b=e.target.closest("[data-viewport]");if(b){viewport=b.dataset.viewport;history.replaceState(null,"",hashFor(currentFlow,currentStep,viewport,actionOutcome));render()}});el("mapToggle").addEventListener("click",()=>{mapVisible=!mapVisible;render()});el("diagnosticsToggle").addEventListener("click",()=>{diagnosticsVisible=!diagnosticsVisible;render()});window.addEventListener("hashchange",()=>syncFromHash({focus:true}));window.addEventListener("popstate",()=>syncFromHash({focus:true}));
    if(!location.hash){history.replaceState(null,"",hashFor(currentFlow,currentStep));render()}else syncFromHash();
  </script>
</body>
</html>
