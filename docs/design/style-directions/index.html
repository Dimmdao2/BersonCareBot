<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BersonCare — дизайн-лаборатория (E)</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          sans-serif;
      }
      body {
        display: flex;
        height: 100vh;
        overflow: hidden;
        background: #e7e4df;
        color: #1c1d22;
      }
      .panel {
        width: 312px;
        flex: none;
        background: #fbfaf8;
        border-right: 1px solid #e2ddd3;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
      }
      .brand {
        padding: 16px 18px;
        border-bottom: 1px solid #ece7dd;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
      }
      .brand b {
        font-size: 14.5px;
        font-weight: 600;
      }
      .brand span {
        display: block;
        font-size: 11.5px;
        color: #8a8578;
        margin-top: 2px;
      }
      .iconbtn {
        font: inherit;
        font-size: 14px;
        line-height: 1;
        border: 1px solid #d8d3c8;
        background: #fff;
        border-radius: 7px;
        width: 28px;
        height: 28px;
        flex: none;
        cursor: pointer;
        color: #42474f;
      }
      .iconbtn:hover {
        background: #f0ece3;
      }
      body.collapsed .panel {
        display: none;
      }
      .expandbtn {
        display: none;
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 5;
        font: inherit;
        font-size: 12px;
        font-weight: 500;
        height: 30px;
        padding: 0 12px;
        border-radius: 8px;
        border: 1px solid #d8d3c8;
        background: #fff;
        cursor: pointer;
        color: #42474f;
        box-shadow: 0 1px 5px rgba(0, 0, 0, 0.12);
      }
      .expandbtn:hover {
        background: #f0ece3;
      }
      body.collapsed .expandbtn {
        display: block;
      }
      .sec {
        padding: 14px 14px 4px;
        font-size: 10.5px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #9a9384;
        font-weight: 600;
      }
      .nav {
        display: flex;
        flex-direction: column;
        gap: 3px;
        padding: 2px 10px 8px;
      }
      .nav button {
        font: inherit;
        font-size: 13px;
        text-align: left;
        padding: 9px 12px;
        border-radius: 9px;
        border: 1px solid transparent;
        background: transparent;
        color: #42474f;
        cursor: pointer;
        transition: 0.12s;
      }
      .nav button:hover {
        background: #f0ece3;
      }
      .nav button.on {
        background: #42608a;
        border-color: #42608a;
        color: #fff;
        font-weight: 500;
      }
      .nav button small {
        display: block;
        font-size: 11px;
        opacity: 0.6;
        margin-top: 1px;
      }
      .nav button.on small {
        opacity: 0.75;
        color: #fff;
      }
      .ctl {
        padding: 6px 14px 14px;
        display: flex;
        flex-direction: column;
        gap: 13px;
        border-top: 1px solid #ece7dd;
        margin-top: 6px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .row label {
        font-size: 12.5px;
        color: #53565e;
      }
      .row input[type='color'] {
        width: 38px;
        height: 26px;
        border: 1px solid #d8d3c8;
        border-radius: 6px;
        background: #fff;
        padding: 1px;
        cursor: pointer;
      }
      .row input[type='range'] {
        flex: 1;
        max-width: 130px;
      }
      .row .val {
        font-size: 11.5px;
        color: #8a8578;
        min-width: 30px;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .toggle {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 11px 14px;
        border-top: 1px solid #ece7dd;
      }
      .toggle label {
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      .switch {
        position: relative;
        width: 40px;
        height: 23px;
        flex: none;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        inset: 0;
        background: #cfc9bd;
        border-radius: 999px;
        transition: 0.15s;
        cursor: pointer;
      }
      .slider::before {
        content: '';
        position: absolute;
        height: 17px;
        width: 17px;
        left: 3px;
        top: 3px;
        background: #fff;
        border-radius: 50%;
        transition: 0.15s;
      }
      .switch input:checked + .slider {
        background: #42608a;
      }
      .switch input:checked + .slider::before {
        transform: translateX(17px);
      }
      .acts {
        display: flex;
        gap: 8px;
        padding: 4px 14px 14px;
      }
      .acts button {
        font: inherit;
        font-size: 12px;
        padding: 7px 11px;
        border-radius: 8px;
        border: 1px solid #d8d3c8;
        background: #fff;
        cursor: pointer;
        color: #42474f;
      }
      .acts button:hover {
        background: #f0ece3;
      }
      details {
        padding: 0 14px 16px;
      }
      details summary {
        font-size: 12px;
        color: #8a8578;
        cursor: pointer;
      }
      details textarea {
        width: 100%;
        height: 150px;
        margin-top: 8px;
        font-family: ui-monospace, monospace;
        font-size: 11px;
        border: 1px solid #e2ddd3;
        border-radius: 8px;
        padding: 8px;
        background: #fff;
        color: #42474f;
        resize: vertical;
      }
      main {
        flex: 1;
        min-width: 0;
        position: relative;
        background: #e7e4df;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: #f3f1ed;
      }
      .hint {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        background: #16202e;
        color: #fff;
        font-size: 11.5px;
        padding: 5px 12px;
        border-radius: 999px;
        opacity: 0;
        transition: 0.3s;
        pointer-events: none;
      }
      .hint.show {
        opacity: 0.92;
      }
    </style>
  </head>
  <body>
    <aside class="panel">
      <div class="brand">
        <div>
          <b>BersonCare · дизайн-лаборатория</b><span>направление E · светлый сайдбар</span>
        </div>
        <button
          id="collapse"
          class="iconbtn"
          title="Свернуть панель — посмотреть страницу на всю ширину"
        >
          ⟨
        </button>
      </div>

      <div class="sec">Архетипы</div>
      <div class="nav" id="nav">
        <button data-src="lab/dashboard.html" class="on">
          Сегодня<small>дашборд · KPI · виджеты</small>
        </button>
        <button data-src="lab/catalog-exercises.html">
          Упражнения<small>каталог · превью · табы</small>
        </button>
        <button data-src="lab/comms.html">Коммуникации<small>master-detail · лента</small></button>
        <button data-src="lab/schedule.html">Расписание<small>календарь · чипы</small></button>
        <button data-src="lab/patients.html">Пациенты<small>списки · таблица</small></button>
        <button data-src="lab/patient-card.html">
          Карта пациента<small>новый роут · 6 вкладок</small>
        </button>
        <button data-src="lab/patient-visit.html">
          Создание визита<small>Карта · первичн/повторн</small>
        </button>
      </div>

      <div class="toggle">
        <span class="switch"
          ><input type="checkbox" id="themeOn" checked /><span class="slider"></span
        ></span>
        <label for="themeOn">Тема E (выкл = оригинал)</label>
      </div>

      <div class="sec">Токены (живая правка)</div>
      <div class="ctl">
        <div class="row">
          <label>Канва (фон)</label><input type="color" id="t_canvas" value="#f9f9f6" />
        </div>
        <div class="row">
          <label>Акцент</label><input type="color" id="t_accent" value="#42608a" />
        </div>
        <div class="row">
          <label>Сайдбар</label><input type="color" id="t_sidebar" value="#cbcbcb" />
        </div>
        <div class="row">
          <label>Границы</label><input type="color" id="t_border" value="#e7e3db" />
        </div>
        <div class="row">
          <label>Радиус карт.</label
          ><input type="range" id="t_radius" min="0" max="20" step="1" value="9" /><span
            class="val"
            id="v_radius"
            >9</span
          >
        </div>
        <div class="row">
          <label>Тень карт.</label
          ><input type="range" id="t_shadow" min="0" max="3" step="1" value="1" /><span
            class="val"
            id="v_shadow"
            >1</span
          >
        </div>
      </div>
      <div class="acts">
        <button id="reset">Сбросить к E</button>
      </div>
      <details>
        <summary>CSS текущих значений (для переноса)</summary>
        <textarea id="readout" readonly></textarea>
      </details>
    </aside>

    <main>
      <button id="expand" class="expandbtn" title="Показать дизайн-лабораторию">
        ⟩ Лаборатория
      </button>
      <iframe id="view" src="lab/dashboard.html"></iframe>
      <div class="hint" id="hint"></div>
    </main>

    <script>
      const DEFAULTS = {
        canvas: '#f9f9f6',
        accent: '#42608a',
        sidebar: '#cbcbcb',
        border: '#e7e3db',
        radius: 9,
        shadow: 1,
      };
      const SHADOWS = [
        'none',
        '0 1px 2px rgba(28,24,18,.05),0 3px 8px rgba(28,24,18,.06)',
        '0 2px 4px rgba(28,24,18,.05),0 8px 20px rgba(28,24,18,.08)',
        '0 4px 10px rgba(28,24,18,.06),0 14px 30px rgba(28,24,18,.12)',
      ];
      const $ = (id) => document.getElementById(id);
      const view = $('view'),
        hint = $('hint');
      let themeOn = true;

      function vals() {
        return {
          canvas: $('t_canvas').value,
          accent: $('t_accent').value,
          sidebar: $('t_sidebar').value,
          border: $('t_border').value,
          radius: +$('t_radius').value,
          shadow: +$('t_shadow').value,
        };
      }
      function buildCSS(v) {
        return (
          `#app-shell-doctor{` +
          `--background:${v.canvas};--color-background:${v.canvas};` +
          `--primary:${v.accent};--color-primary:${v.accent};--ring:${v.accent};--color-ring:${v.accent};` +
          `--border:${v.border};--color-border:${v.border};--input:${v.border};--color-input:${v.border};` +
          `--radius:${(v.radius / 16).toFixed(3)}rem;}` +
          `#app-shell-doctor,#app-shell-content{background:${v.canvas} !important;}` +
          `#app-shell-doctor [data-doctor-page-header]{background:#ffffff !important;box-shadow:none !important;}` +
          `html body #doctor-admin-sidebar{background:${v.sidebar} !important;border-right:1px solid ${v.border} !important;}` +
          `#app-shell-content .bg-card{background:#ffffff !important;border-color:${v.border} !important;` +
          `border-radius:${v.radius}px !important;box-shadow:${SHADOWS[v.shadow]} !important;}`
        );
      }
      function apply() {
        $('v_radius').textContent = $('t_radius').value;
        $('v_shadow').textContent = $('t_shadow').value;
        const css = buildCSS(vals());
        $('readout').value = css.replace(/}/g, '}\n');
        const doc = view.contentDocument;
        if (!doc || !doc.body) return;
        // toggle baked theme-e stylesheet
        doc.querySelectorAll('link').forEach((l) => {
          if (/theme-e\.css/.test(l.getAttribute('href') || '')) l.disabled = !themeOn;
        });
        // live override style — MUST be last in <body> so it wins over the baked theme-e.css link (which sits at end of body)
        let s = doc.getElementById('lab-live');
        if (!themeOn) {
          if (s) s.textContent = '';
          return;
        }
        if (!s) {
          s = doc.createElement('style');
          s.id = 'lab-live';
        }
        doc.body.appendChild(s); // (re)append → keep it the very last stylesheet in the cascade
        s.textContent = css;
      }
      function flash(t) {
        hint.textContent = t;
        hint.classList.add('show');
        clearTimeout(flash._t);
        flash._t = setTimeout(() => hint.classList.remove('show'), 1100);
      }

      // nav
      $('nav').addEventListener('click', (e) => {
        const b = e.target.closest('button');
        if (!b) return;
        $('nav')
          .querySelectorAll('button')
          .forEach((x) => x.classList.remove('on'));
        b.classList.add('on');
        view.src = b.dataset.src;
        flash(b.textContent.split('\n')[0]);
      });
      // re-apply on every page load
      view.addEventListener('load', apply);
      // controls
      ['t_canvas', 't_accent', 't_sidebar', 't_border', 't_radius', 't_shadow'].forEach((id) =>
        $(id).addEventListener('input', apply),
      );
      $('themeOn').addEventListener('change', (e) => {
        themeOn = e.target.checked;
        apply();
      });
      $('reset').addEventListener('click', () => {
        $('t_canvas').value = DEFAULTS.canvas;
        $('t_accent').value = DEFAULTS.accent;
        $('t_sidebar').value = DEFAULTS.sidebar;
        $('t_border').value = DEFAULTS.border;
        $('t_radius').value = DEFAULTS.radius;
        $('t_shadow').value = DEFAULTS.shadow;
        apply();
      });
      // collapse / expand the lab panel (see page at realistic full width)
      $('collapse').addEventListener('click', () => document.body.classList.add('collapsed'));
      $('expand').addEventListener('click', () => document.body.classList.remove('collapsed'));
    </script>
  </body>
</html>
