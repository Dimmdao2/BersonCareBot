apply plugin: 'com.android.application'

android {
    namespace = "ru.therapygo.app"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "ru.therapygo.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            buildConfigField "boolean", "SHELL_DEBUG", "true"
        }
        release {
            minifyEnabled false
            buildConfigField "boolean", "SHELL_DEBUG", "false"
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    testOptions {
        unitTests {
            includeAndroidResources = false
            returnDefaultValues = false
        }
    }
    flavorDimensions += ["brand", "environment"]
    productFlavors {
        therapygo {
            dimension "brand"
            applicationId "ru.therapygo.app"
            buildConfigField "String", "SHELL_BRAND", '"therapygo"'
            buildConfigField "String", "SHELL_PRODUCTION_ORIGIN", '"https://therapygo.ru"'
            buildConfigField "String", "SHELL_START_PATH", '"/app/patient"'
        }
        therapysto {
            dimension "brand"
            applicationId "ru.therapysto.app"
            buildConfigField "String", "SHELL_BRAND", '"therapysto"'
            buildConfigField "String", "SHELL_PRODUCTION_ORIGIN", '"https://therapysto.ru"'
            buildConfigField "String", "SHELL_START_PATH", '"/app/doctor"'
        }
        // Android Gradle reserves names beginning with `test` for test source
        // sets. This is still the logical `test` environment exposed by its
        // BuildConfig and the documented task aliases below.
        environmentTest {
            dimension "environment"
            applicationIdSuffix ".test"
            buildConfigField "String", "SHELL_ENVIRONMENT", '"test"'
        }
        production {
            dimension "environment"
            buildConfigField "String", "SHELL_ENVIRONMENT", '"production"'
        }
    }
}

tasks.register("assembleTherapygoTestDebug") { dependsOn "assembleTherapygoEnvironmentTestDebug" }
tasks.register("assembleTherapystoTestDebug") { dependsOn "assembleTherapystoEnvironmentTestDebug" }
tasks.register("assembleTherapygoTestRelease") { dependsOn "assembleTherapygoEnvironmentTestRelease" }
tasks.register("assembleTherapystoTestRelease") { dependsOn "assembleTherapystoEnvironmentTestRelease" }
tasks.register("bundleTherapygoTestRelease") { dependsOn "bundleTherapygoEnvironmentTestRelease" }
tasks.register("bundleTherapystoTestRelease") { dependsOn "bundleTherapystoEnvironmentTestRelease" }

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    // Audit-added (#915 auditor-live): behavioral acceptance tests for NavigationPolicyPlugin,
    // TrustedOriginGate and ShellRuntimePlugin need a real android.net.Uri/WebView/Bridge boundary.
    testImplementation "org.robolectric:robolectric:$robolectricVersion"
    testImplementation "androidx.test:core:$androidxTestCoreVersion"
    testImplementation "org.mockito:mockito-core:$mockitoCoreVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
